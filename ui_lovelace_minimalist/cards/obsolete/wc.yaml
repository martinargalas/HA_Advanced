view_layout:
  grid-area: "wc"     
  place-self: left end stretch
type: 'custom:button-card'
template:
  - card_room
  - yellow_on
  - grey_no_state      
name: WC
entity: switch.light_wc
icon: mdi:toilet
label: >
  [[[
    return "🌡️" + Math.round((states['sensor.smart_radiator_thermostat_e1_current_temperature_11'].state) * 100) / 100 + " °C"
  ]]]
tap_action:
  action: toggle
variables:
  label_use_temperature: false
  label_use_brightness: true
  entity_1:
    entity_id: switch.light_wc
    templates:
      - yellow_on
    tap_action:
      action: toggle
  entity_2:
    entity_id: binary_sensor.motion_sensor_wc
    templates:
      - blue_on
    tap_action:
      action: