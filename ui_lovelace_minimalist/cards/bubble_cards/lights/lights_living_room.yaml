view_layout:
  grid-area: "living_room_1"
type: entities
show_header_toggle: false
card_mod:
  style: |
    ha-card {
      max-height: 260px;
      border-radius: 34px;
      padding: 8px;
      background: var(--mod-card-background);
      backdrop-filter: blur(35px) saturate(100%);
      -webkit-backdrop-filter: blur(35px) saturate(200%);
      border: 1px solid var(--mod-card-border);
      box-shadow: 
        0 15px 25px var(--mod-card-shadow), 
        inset 0 2px 3px var(--mod-card-inset-shadow);
    }

    ha-card::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 34px;
      padding: 8px;
      background: linear-gradient(
        120deg,
        var(--mod-card-gradient-start),
        var(--mod-card-gradient-mid) 25%,
        var(--mod-card-gradient-end) 50%,
        transparent 70%
      );
      opacity: 0.35;
      pointer-events: none;
    }
entities:
  - type: "custom:button-card"
    template:
      - card_light_slider_collapse_color
      - yellow_on
      - grey_no_state
    entity: light.living_room
    variables:
      ulm_card_light_enable_slider: true
      ulm_card_light_enable_color: true
      ulm_card_light_enable_popup_tap: false
      ulm_card_light_enable_buttons: true
      ulm_card_light_name: "Pohovka"
      ulm_card_light_slider_horizontal_colors_name: Ceiling light
      ulm_card_light_slider_horizontal_colors_transition: 1
      ulm_card_light_enable_collapse: false
      ulm_card_light_force_background_color: false
    card_mod:
      style: |
        ha-card::before {
          content: "";
          position: absolute;
          inset: 0;
          
          background: linear-gradient(
            120deg,
            var(--button-card-before-gradient-start),
            var(--button-card-before-gradient-mid) 30%,
            var(--button-card-before-gradient-end) 60%
          );
          opacity: 0.35;
          pointer-events: none;
        }
        ha-card::after {
          content: "";
          position: absolute;
          inset: 0;
          
          box-shadow:
            inset 0 0 0 1.5px var(--button-card-after-border),
            inset 0 0 20px var(--button-card-after-shadow);
          pointer-events: none;
        } 
  - type: custom:rgb-light-card
    entity: light.living_room
    justify: center
    colors:
      - type: call-service
        service: scene.turn_on
        service_data:
          entity_id: scene.living_room_relax
        icon_color: center/140% url('http://192.168.4.24:8123/local/community/spotify/Relax.png')
      - type: call-service
        service: scene.turn_on
        service_data:
          entity_id: scene.kuchyne_concentrate
        icon_color: center/120% url('http://192.168.4.24:8123/local/community/spotify/Concentrate.png')
      - type: call-service
        service: scene.turn_on
        service_data:
          entity_id: scene.kuchyne_read
        icon_color: center/120% url('http://192.168.4.24:8123/local/community/spotify/Read.png')
      - type: call-service
        service: scene.turn_on
        service_data:
          entity_id: scene.kuchyne_nightlight
        icon_color: center/120% url('http://192.168.4.24:8123/local/community/spotify/Night.png')
      - type: call-service
        service: scene.turn_on
        service_data:
          entity_id: scene.kuchyne_natural_light
        icon_color: center/120% url('http://192.168.4.24:8123/local/community/spotify/Natural.png')
