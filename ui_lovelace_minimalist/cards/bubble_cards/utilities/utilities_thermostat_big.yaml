view_layout:
  grid-area: thermostat_big
type: custom:vertical-stack-in-card
card_mod:
  style: |
    ha-card {
      border-radius: 34px;
      padding: 20px;
      background: var(--mod-card-background);
      backdrop-filter: blur(35px) saturate(100%);
      -webkit-backdrop-filter: blur(35px) saturate(200%);
      border: 1px solid var(--mod-card-border);
      box-shadow: 
        0 15px 25px var(--mod-card-shadow), 
        inset 0 2px 3px var(--mod-card-inset-shadow);
    }

    ha-card::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 34px;
      background: linear-gradient(
        120deg,
        var(--mod-card-gradient-start),
        var(--mod-card-gradient-mid) 25%,
        var(--mod-card-gradient-end) 50%,
        transparent 70%
      );
      opacity: 0.35;
      pointer-events: none;
    }
      
cards:
  - type: horizontal-stack
    card_mod:
      style: |
        ha-card {
            background-color: transparent;
            box-shadow: none;
          }
    cards:
    - type: custom:mushroom-template-card
      entity: binary_sensor.e3_tcu10_x07_compressor
      name: " "
      icon: mdi:heat-pump
      primary: >
        Kompresor {{ 'běží' if is_state(entity, 'on') else 'neběží' }}
      secondary: " "
      card_mod:
        style:
          mushroom-state-info$: |
            .container {
              --card-primary-color: var(--text-color);
              --card-secondary-color: var(--text-color);
            }
            .primary {
              background: rgba(var(--color-background-black),0.3) !important;

              margin-left: -74px !important;
              margin-top: 0px !important;
              margin-right: 10px !important;
              border-radius: 32px;

              height: 56px !important;

              display: inline-flex;
              justify-content: left;
              align-items: center;
              font-size: 14px !important;
              font-weight: 600;
              line-height: 1;

              transform: translate(12px, 6px);
              box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
              pointer-events: none;
              padding-left: 60px; 
            }

          mushroom-shape-icon$: |
            {% set sun_state = states('sun.sun') %}
            {% set glow_color = 'var(--color-background-theme)' %}
            ha-icon {
              {{ '--icon-animation: rotation 1s linear infinite;' if is_state(config.entity, 'on') }}
              transform-origin: 29% 88%;
            }
            .shape {
              {{ '--shape-animation: ping 2s infinite;' if is_state(config.entity, 'on') }}
              background-color: 
                {% if is_state(config.entity, 'on') %}
                  rgba({{ glow_color }},0.15) !important;
                {% else %}
                  rgba(var(--color-grey),0.2) !important;
                {% endif %};
              position: relative;
              z-index: 3;   /* ikona bude nad vším */
            }
            :host {
              {% if is_state(config.entity, 'on') %}
                --card-mod-icon-color: rgb({{ glow_color }});   # ikona kopíruje den/noc
              {% else %}
                --card-mod-icon-color: rgba(var(--color-grey),1);
              {% endif %}
            }

            @keyframes ping {
              0% { box-shadow: 0 0 0 0 rgba({{ glow_color }},1); }
              70% { box-shadow: 0 0 0 10px transparent; }
              100% { box-shadow: 0 0 0 0 transparent; }
            }

          .: |
            mushroom-shape-icon {
              --icon-size: 48px;
              margin-top: 12px !important;
              display: flex;
            }
            ha-card {
              clip-path: inset(0 0 0 0 round var(--ha-card-border-radius, 12px));
              background: none !important;
              margin-top: -10px !important;
              margin-bottom: 10px !important;
            }

    - type: custom:mushroom-template-card
      entity: sensor.water_heating_on
      icon: mdi:shower-head
      icon_color: cyan
      name: Ohřev vody
      primary: >
        Ohřev vody {{ 'zapnutý' if is_state(entity, 'on') else 'vypnutý' }}
      secondary: " "
      card_mod:
        style:
          mushroom-state-info$: |
            .container {
              --card-primary-color: var(--text-color);
              --card-secondary-color: var(--text-color);
            }
            .primary {
              background: rgba(var(--color-background-black),0.3) !important;
              color: white;

              margin-left: -74px !important;
              margin-top: 0px !important;
              margin-right: 10px !important;
              border-radius: 32px;

              height: 56px !important;

              display: inline-flex;
              justify-content: left;
