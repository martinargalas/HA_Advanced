# VIRTUAL BATTERY
- type: custom:swipe-card
  style:
    bottom: 12px
    left: calc(50%)
    width: 300px
    height: 100px
    transform: translate(0,0)
  parameters:
    effect: 'cube'
    speed: 500
    slideShadows: false
    autoplay:
      delay: 10000
      disableOnInteraction: false
    cubeEffect:
      slideShadows: false
      shadow: false
  cards:
  # BATTERY
  - type: custom:button-card
    entity: input_boolean.alarmed_toggle
    show_icon: false
    show_label: false
    show_name: false
    tap_action:
      action: none    
    custom_fields:
      labelyear1:
        card:
          type: "custom:button-card"
          tap_action:
            action: none   
          show_name: false
          show_label: true
          show_icon: false
          label: "Celkem"
          entity: sensor.virtual_battery_contract
          styles:
            card:
              - box-shadow: "none"
              - background-color: "transparent"      
              - height: "21px"
              - width: "70px"
              - padding: "0px"
            label:
              - justify-self: "start"
              - font-size: "14px"
              - font-weight: 430
              - text-overflow: "ellipsis"
              - overflow: "hidden"
              - margin-top: "5%"
              - margin-left: "20%"
      labelyear2:
        card:
          type: "custom:button-card"
          tap_action:
            action: none   
          show_name: false
          show_label: true
          show_icon: false
          label: >-
            [[[
              return states['sensor.virtual_battery_contract'].state + " kWh";
            ]]]
          entity: sensor.virtual_battery_contract
          styles:
            card:
