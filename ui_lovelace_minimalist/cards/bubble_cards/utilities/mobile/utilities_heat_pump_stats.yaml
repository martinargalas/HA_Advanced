view_layout:
  grid-area: heat_pump_stats
type: custom:button-card
show_state: false
show_label: false
show_name: false
show_icon: false
tap_action:
  action: none
double_tap_action:
  action: none
hold_action:
  action: none
styles:
  card:
    - max-width: calc(100% - 20px)
    - border-radius: 26px
    - margin: 5px
    - padding-left: 10px
    - padding-right: 10px
    - padding-bottom: 25px
    - padding-top: 10px
  grid:
    
    - grid-template-rows: "min-content"
    - grid-template-columns: 1fr 1fr 1fr 1fr 
    - grid-template-rows: 1fr
    - grid-template-areas: >  
        "water compressor pump frost"

  custom_fields:
    water:
      - place-self:  center
      - justify-self: center
    compressor:
      - place-self:  center
      - justify-self: center
    pump:
      - place-self:  center
      - justify-self: center
    frost:
      - place-self:  center
      - justify-self: center

custom_fields:
  water:
    card:
      type: "custom:button-card"
      show_name: false
      show_label: false
      show_icon: true
      entity: sensor.water_heating_on
      icon: mdi:shower-head
      tap_action:
        action: none
      double_tap_action:
        action: none
      hold_action:
        action: none

      styles:
        card:
          - border-radius: "42px"
          - height: "52px"
          - width: "52px"
          - background: var(--macos-red-background)
          - backdrop-filter: blur(20px) saturate(180%)
          - -webkit-backdrop-filter: blur(20px) saturate(180%)
          - border: 1px solid var(--button-card-border)
          - box-shadow:
              - 0 10px 25px var(--button-card-shadow)
              - inset 0 1px 1px var(--button-card-inset-shadow)
          - position: relative
          - overflow: visible
          - transition: transform 0.25s ease
          - animation: none

        icon:
          - width: 28px
          - color: var(--button-card-icon)
          - filter: drop-shadow(0 2px 6px var(--button-card-icon-shadow))

      state:
        - value: "on"
          styles:
            card:
              - background: var(--macos-blueorange-background)
              - animation: "glow-card 2s ease-in-out infinite"
        - value: "off"
          styles:
            card:
              - background: none
              - animation: none

      extra_styles: |
        @keyframes glow-card {
          0%, 100% {
            box-shadow:
              0 10px 25px var(--button-card-shadow),
              inset 0 1px 1px var(--button-card-inset-shadow);
          }
          50% {
            box-shadow:
              0 10px 25px var(--button-card-shadow),
              inset 0 2px 1px var(--button-card-inset-shadow),
              0 0 6px 6px var(--macos-blueorange-background);
          }
        }

  compressor:
    card:
      type: "custom:button-card"
      show_name: false
      show_label: false
      show_icon: true
      entity: binary_sensor.e3_tcu10_x07_compressor
      icon: mdi:heat-pump
      tap_action:
        action: none
      double_tap_action:
        action: none
      hold_action:
        action: none

      styles:
        card:
          - border-radius: "42px"
          - height: "52px"
          - width: "52px"
          - background: var(--button-card-background)
          - backdrop-filter: blur(20px) saturate(180%)
          - -webkit-backdrop-filter: blur(20px) saturate(180%)
          - border: 1px solid var(--button-card-border)
          - box-shadow:
              - 0 10px 25px var(--button-card-shadow)
              - inset 0 1px 1px var(--button-card-inset-shadow)
          - position: relative
          - overflow: visible
          - transition: transform 0.25s ease
          - animation: none

        icon:
          - width: 28px
          - color: var(--button-card-icon)
          - filter: drop-shadow(0 2px 6px var(--button-card-icon-shadow))

      state:
        - value: "on"
          styles:
            card:
              - background: var(--macos-blueorange-background)
              - animation: "glow-card 2s ease-in-out infinite"
        - value: "off"
          styles:
            card:
              - background: none
              - animation: none

      extra_styles: |
        @keyframes glow-card {
          0%, 100% {
            box-shadow:
              0 10px 25px var(--button-card-shadow),
              inset 0 1px 1px var(--button-card-inset-shadow);
          }
          50% {
            box-shadow:
              0 10px 25px var(--button-card-shadow),
              inset 0 2px 1px var(--button-card-inset-shadow),
              0 0 6px 6px var(--macos-blueorange-background);
          }
        }

  pump:
    card:
      type: "custom:button-card"
      show_name: false
      show_label: false
      show_icon: true
      entity: binary_sensor.e3_tcu10_x07_circulation_pump
      icon: mdi:pump

      tap_action:
        action: none
      double_tap_action:
        action: none
      hold_action:
        action: none

      state:
        - value: "on"
          styles:
            icon:
              - animation: spin 1.7s linear infinite
              - filter: drop-shadow(0 0 6px var(--macos-blueorange-background)) drop-shadow(0 2px 6px var(--button-card-icon-shadow))
            card:
              - background: var(--macos-orange-background) 
              - box-shadow:
                  - 0 10px 25px var(--button-card-shadow)
                  - 0 0 18px var(--macos-blueorange-background)
                  - inset 0 1px 1px var(--button-card-inset-shadow)

        - value: "off"
          styles:
            icon:
              - animation: none
              - filter: drop-shadow(0 2px 6px var(--button-card-icon-shadow))

      styles:
        card:
          - border-radius: "42px"
          - height: "52px"
          - width: "52px"
          - background: var(--button-card-background)
          - backdrop-filter: blur(20px) saturate(180%)
          - -webkit-backdrop-filter: blur(20px) saturate(180%)
          - border: 1px solid var(--button-card-border)
          - box-shadow:
              - 0 10px 25px var(--button-card-shadow)
              - inset 0 1px 1px var(--button-card-inset-shadow)
          - position: relative
          - overflow: hidden
          - transition: transform 0.25s ease

        icon:
          - width: 28px
          - color: var(--button-card-icon)
          - filter: drop-shadow(0 2px 6px var(--button-card-icon-shadow))

      extra_styles: |
        @keyframes spin {
          0% {
            transform: rotate(0deg);
          }
          100% {
            transform: rotate(360deg);
          }
        }

  frost:
    card:
      type: "custom:button-card"
      show_name: false
      show_label: false
      show_icon: true
      entity: binary_sensor.e3_tcu10_x07_frost_protection
      icon: mdi:snowflake
      tap_action:
        action: none
      double_tap_action:
        action: none
      hold_action:
        action: none

      styles:
        card:
          - border-radius: "42px"
          - height: "52px"
          - width: "52px"
          - background: var(--button-card-background)
          - backdrop-filter: blur(20px) saturate(180%)
          - -webkit-backdrop-filter: blur(20px) saturate(180%)
          - border: 1px solid var(--button-card-border)
          - box-shadow:
              - 0 10px 25px var(--button-card-shadow)
              - inset 0 1px 1px var(--button-card-inset-shadow)
          - position: relative
          - overflow: visible
          - transition: transform 0.25s ease
          - animation: none

        icon:
          - width: 28px
          - color: var(--button-card-icon)
          - filter: drop-shadow(0 2px 6px var(--button-card-icon-shadow))

      state:
        - value: "on"
          styles:
            card:
              - background: var(--macos-blueorange-background)
              - animation: "glow-card 2s ease-in-out infinite"
        - value: "off"
          styles:
            card:
              - background: none
              - animation: none

      extra_styles: |
        @keyframes glow-card {
          0%, 100% {
            box-shadow:
              0 10px 25px var(--button-card-shadow),
              inset 0 1px 1px var(--button-card-inset-shadow);
          }
          50% {
            box-shadow:
              0 10px 25px var(--button-card-shadow),
              inset 0 2px 1px var(--button-card-inset-shadow),
              0 0 6px 6px var(--macos-blueorange-background);
          }
        }

