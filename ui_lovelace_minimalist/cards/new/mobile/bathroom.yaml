type: custom:button-card
name: Koupelna
icon: mdi:shower
show_state: false
show_label: false
show_name: false
tap_action:
  action: none
double_tap_action:
  action: none
hold_action:
  action: none
styles:
  card:
    - height: 120px
    - border-radius: 26px
    - padding: 7px
    - position: relative
    - overflow: hidden
    - transition: transform 0.25s ease
  icon:
    - width: 42px
    - color: var(--button-card-icon)
    - filter: drop-shadow(0 2px 6px var(--button-card-icon-shadow))
  name:
    - font-size: 20px
    - font-weight: 600
    - color: var(--button-card-name)
  label:
    - font-size: 14px
    - color: var(--button-card-label)
      
  grid:
    
    - grid-template-rows: "min-content"
    - grid-template-columns: 1fr 1fr 1fr 
    - grid-template-rows: 1fr 1fr
    - grid-template-areas: >
        "i i i"
        "item1 item2 item3 "

  custom_fields:
    item1:
      - place-self:  center
      - justify-self: center
    item2:
      - place-self:  center
      - justify-self: center
    item3:
      - place-self:  center
      - justify-self: center
    item4:
      - place-self:  center
      - justify-self: center
    
custom_fields:
  item1:
    card:
      type: "custom:button-card"
      show_name: false
      show_label: false
      show_icon: true
      label: "Světlo"
      entity: switch.light_bathroom_ceiling
      icon: mdi:lightbulb-outline
      tap_action:
        action: toggle
      state:
      - value: "on"
        styles:
          card:
            - background: var(--macos-yellow-background)   
      - value: "off"
        styles:
          card:
            - background: none   
      styles:
        card:
          - border-radius: "42px"       
          - height: "52px"
          - width: "52px"
          - background: var(--button-card-background)
          - backdrop-filter: blur(20px) saturate(180%)
          - -webkit-backdrop-filter: blur(20px) saturate(180%)
          - border: 1px solid var(--button-card-border)
          - box-shadow:
              - 0 10px 25px var(--button-card-shadow)
              - inset 0 1px 1px var(--button-card-inset-shadow)
          - position: relative
          - overflow: hidden
          - transition: transform 0.25s ease
        icon:
          - width: 28px
          - color: var(--button-card-icon)
          - filter: drop-shadow(0 2px 6px var(--button-card-icon-shadow))
  item2:
    card:
      type: "custom:button-card"
      show_name: false
      show_label: false
      show_icon: true
      label: "Koupelna obsazena"
      entity: binary_sensor.motion_sensor_bathroom
      icon: mdi:minus-circle
      state:
      - operator: template
        value: >
          [[[ 
            return states['binary_sensor.motion_sensor_bathroom'].state === 'on'
              || states['media_player.bathroom'].state === 'playing';
          ]]]
        styles:
          card:
            - background: var(--macos-red-background)

      - operator: template
        value: >
          [[[ 
            return states['binary_sensor.motion_sensor_bathroom'].state !== 'on'
              && states['media_player.bathroom'].state !== 'playing';
          ]]]
        styles:
          card:
            - background: none
      styles:
        card:
          - border-radius: "42px"       
          - height: "52px"
          - width: "52px"
          - background: var(--button-card-background)
          - backdrop-filter: blur(20px) saturate(180%)
          - -webkit-backdrop-filter: blur(20px) saturate(180%)
          - border: 1px solid var(--button-card-border)
          - box-shadow:
              - 0 10px 25px var(--button-card-shadow)
              - inset 0 1px 1px var(--button-card-inset-shadow)
          - position: relative
          - overflow: hidden
          - transition: transform 0.25s ease
        icon:
          - width: 28px
          - color: var(--button-card-icon)
          - filter: drop-shadow(0 2px 6px var(--button-card-icon-shadow))

  item3:
    card:
      type: "custom:button-card"
      show_name: false
      show_label: false
      show_icon: true
      label: "Sonos koupelna"
      entity: media_player.bathroom
      icon: mdi:speaker
      tap_action:
        action: toggle
      state:
      - value: "playing"
        styles:
          card:
            - background: var(--macos-blue-background)   
      - value: "off"
        styles:
          card:
            - background: none  
      styles:
        card:
          - border-radius: "42px"       
          - height: "52px"
          - width: "52px"
          - background: var(--button-card-background)
          - backdrop-filter: blur(20px) saturate(180%)
          - -webkit-backdrop-filter: blur(20px) saturate(180%)
          - border: 1px solid var(--button-card-border)
          - box-shadow:
              - 0 10px 25px var(--button-card-shadow)
              - inset 0 1px 1px var(--button-card-inset-shadow)
          - position: relative
          - overflow: hidden
          - transition: transform 0.25s ease
        icon:
          - width: 28px
          - color: var(--button-card-icon)
          - filter: drop-shadow(0 2px 6px var(--button-card-icon-shadow))
