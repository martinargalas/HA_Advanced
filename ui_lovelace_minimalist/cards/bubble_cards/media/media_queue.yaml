view_layout:
  grid-area: "media_queue"  
type: vertical-stack
cards:  
  type: custom:sonos-card
  mediaBrowser:
    itemsPerRow: 4
    hideHeader: true
    hideActivePlayerName: true
    onlyFavorites: true
    favorites:
      exclude: []
      topItems: []
      hideTitleForThumbnailIcons: true
  sections:
    - queue
  startSection: queue
  player:
    artworkAsBackgroundBlur: 21
    artworkAsBackground: true
    artworkBorderRadius: 30
    controlsAndHeaderBackgroundOpacity: 0.8
    controlsLargeIcons: false
    hideArtistAlbum: false
    hideArtwork: false
    backgroundOverlayColor: rgba(142,142,147,0.58)
    hideControlPowerButton: false
    hideControls: false
    hideControlNextTrackButton: false
  showNonSonosPlayers: false
  excludeItemsInEntitiesList: false
  queue:
    hideActivePlayerName: false
  entities: []
  entityId: media_player.office
  card_mod:
    style: |
      ha-card {
        height: 562px !important;
        border-radius: 26px !important;
        background: var(--button-card-background)
        backdrop-filter: blur(35px) saturate(100%);
        -webkit-backdrop-filter: blur(35px) saturate(200%);
        border: 1px solid var(--mod-card-border);
        box-shadow: 
          0 15px 25px var(--mod-card-shadow), 
          inset 0 2px 3px var(--mod-card-inset-shadow);
        --accent-color: rgba(var(--macos-text-rgb), 0.8) ;
        --primary-color: rgba(var(--macos-text-rgb), 0.8) ;
        --secondary-text-color: rgba(var(--macos-text-rgb), 0.8) ;
        --secondary-background-color: rgba(var(--macos-blue-rgb), 0.2) ;
      }

      ha-card::before {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 26px;
        background: linear-gradient(
          120deg,
          var(--mod-card-gradient-start),
          var(--mod-card-gradient-mid) 25%,
          var(--mod-card-gradient-end) 50%,
          transparent 70%
        );
        opacity: 0.35;
        pointer-events: none;
      }
