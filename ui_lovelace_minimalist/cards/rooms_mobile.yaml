view_layout:
  grid-area: "rooms"     
  place-self: left end stretch
type: custom:mod-card
card:
  type: grid
  columns: 2
  square: false
  cards:

    - !include /config/ui_lovelace_minimalist/cards/new/mobile/living_room.yaml

    - !include /config/ui_lovelace_minimalist/cards/new/mobile/office.yaml

    - !include /config/ui_lovelace_minimalist/cards/new/mobile/kitchen.yaml

    - !include /config/ui_lovelace_minimalist/cards/new/mobile/kids.yaml

    - !include /config/ui_lovelace_minimalist/cards/new/mobile/laundry.yaml

    - !include /config/ui_lovelace_minimalist/cards/new/mobile/bedroom.yaml

    - !include /config/ui_lovelace_minimalist/cards/new/mobile/wc.yaml

    - !include /config/ui_lovelace_minimalist/cards/new/mobile/bathroom.yaml

card_mod:
  style: |
    ha-card {
      
      border-radius: 34px;
      padding: 10px;
      background: var(--mod-card-background);
      backdrop-filter: blur(35px) saturate(100%);
      -webkit-backdrop-filter: blur(35px) saturate(200%);
      border: 1px solid var(--mod-card-border);
      box-shadow: 
        0 15px 25px var(--mod-card-shadow), 
        inset 0 2px 3px var(--mod-card-inset-shadow);
    }

    ha-card::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 34px;
      background: linear-gradient(
        120deg,
        var(--mod-card-gradient-start),
        var(--mod-card-gradient-mid) 25%,
        var(--mod-card-gradient-end) 50%,
        transparent 70%
      );
      opacity: 0.35;
      pointer-events: none;
    }