view_layout:
  grid-area: "robot_3b"
type: entities
show_header_toggle: false
card_mod:
  style: |
    ha-card {
      border-radius: 34px;
      padding: 20px;
      background: var(--mod-card-background);
      backdrop-filter: blur(35px) saturate(100%);
      -webkit-backdrop-filter: blur(35px) saturate(200%);
      border: 1px solid var(--mod-card-border);
      box-shadow: 
        0 15px 25px var(--mod-card-shadow), 
        inset 0 2px 3px var(--mod-card-inset-shadow);
    }

    ha-card::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 34px;
      background: linear-gradient(
        120deg,
        var(--mod-card-gradient-start),
        var(--mod-card-gradient-mid) 25%,
        var(--mod-card-gradient-end) 50%,
        transparent 70%
      );
      opacity: 0.35;
      pointer-events: none;
    }
entities:
  - type: custom:lawn-mower-card
    entity: lawn_mower.luba_vsqcfhrv
    battery: sensor.luba_vsqcfhrv_battery
    image: http://192.168.4.24:8123/local/community/spotify/luba.png
    show_name: true
    show_toolbar: false
    compact_view: true
    stats:
      mowing:
        - entity_id: sensor.lawn_mower_area_mowed
          subtitle: Area mowed
          unit: m²
        - entity_id: sensor.lawn_mower_mwingtime
          unit: minutes
          subtitle: Mowing time
    shortcuts:
      - name: Spustit
        service: lawn_mower.start_mowing
        service_data:
          entity_id: lawn_mower.luba_vsqcfhrv
        icon: mdi:play
      - name: Zastavit
        service: lawn_mower.pause
        service_data:
          entity_id: lawn_mower.luba_vsqcfhrv
        icon: mdi:stop
      - name: Vrátit do docku
        service: lawn_mower.dock
        service_data:
          entity_id: lawn_mower.luba_vsqcfhrv
        icon: mdi:home-map-marker
    style: |
      ha-card {
        --vc-background: #17A8F4;
        --vc-spacing: 5px;
      }
  - type: custom:map-card
    x: 49.53572888084475
    y: 18.752901808785474
    focus_entity: device_tracker.luba_vsqcfhrv_luba_vsqcfhrv_offset
    tile_layer_url: /local/map/{z}/{x}/{y}.png
    zoom: 20
    entities:
      - entity: device_tracker.luba_vsqcfhrv_luba_vsqcfhrv_offset
        picture: /local/community/spotify/luba.png
        size: 25
        display: marker
        history_start: 24 hours ago
        history_line_color: green
        history_show_dots: false
    card_size: 6
    tile_layers:
      - url: >-
          https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}
    default_zoom: 22
    tile_layer_options:
      maxZoom: 18
    theme_mode: auto
