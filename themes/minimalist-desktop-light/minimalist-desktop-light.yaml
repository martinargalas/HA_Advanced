---
minimalist-desktop-light:
  # Journal
  state-icon-color: "rgb(var(--color-theme))"
  border-radius: "20px"
  ha-card-border-radius: "var(--border-radius)"
  error-color: "var(--google-red)"
  warning-color: "var(--google-yellow)"
  success-color: "var(--google-green)"
  info-color: "var(--google-blue)"
  divider-color: "rgba(var(--color-theme),.12)"
  accent-color: "var(--google-yellow)"
  ha-dialog-border-radius: "10px"
  # fix added border-lines in 2022.11
  ha-card-border-width: "0px"

  card-mod-theme: "minimalist-desktop"
  card-mod-view-yaml: |
    "*:first-child$": |
      #columns .column > * {
        padding-left: 5px;
        padding-right: 5px;
        padding-bottom: 5px;
      }
  lovelace-background: center / cover no-repeat fixed url('/local/community/spotify/light3-4k.jpg')
  # text
  primary-text-color: "#212121"
  # main interface colors
  primary-color: "#434343"
  google-red: "#F54436"
  google-green: "#01C852"
  google-yellow: "235, 184, 2" #"#FF9101"
  google-blue: "#3D5AFE"
  google-violet: "#661FFF"
  google-grey: "#BBBBBB"
  color-red: "245, 68, 54"
  color-green: "1, 200, 82"
  color-yellow: "235, 153, 2" #"255, 145, 1"
  color-blue: "74, 136, 212" #"61, 90, 254"
  color-purple: "102, 31, 255"
  color-grey: "255, 255, 255"
  color-orange: "255, 115, 20"
  color-primary-theme: "255,115,20"
  color-primary-theme-secondary: "250, 250, 250"
  color-pink: "233, 30, 99"
  color-black: "255, 255, 255"
  color-theme: "51,51,51"
  color-background-yellow: "250, 250, 250"
  color-background-grey: "250, 250, 250"
  color-background-theme: "var(--color-primary-theme)"
  color-background-theme-secondary: "var(--color-grey)"
  color-background-blue: "250, 250, 250"
  color-background-green: "250, 250, 250"
  color-background-red: "250, 250, 250"
  color-background-pink: "250, 250, 250"
  color-background-blue2: "var(--color-blue)"
  color-background-black: "var(--color-black)"
  color-background-purple: "var(--color-purple)"
  color-yellow-text: "var(--primary-text-color)"
  color-blue-text: "var(--primary-text-color)"
  color-green-text: "var(--primary-text-color)"
  color-red-text: "var(--primary-text-color)"
  color-pink-text: "var(--primary-text-color)"
  color-purple-text: "var(--primary-text-color)"
  
  opacity-bg: "0.2"
  # background and sidebar
  card-background-color: rgba(var(--color-background-grey),var(--opacity-bg))
  primary-background-color: "#EFEFEF"
  secondary-background-color: "#EFEFEF"
  # header
  app-header-text-color: "var(--primary-text-color)"
  app-header-background-color: "var(--primary-background-color)"
  # paper-tabs-selection-bar-color: "var(--primary-text-color)"
  # slider
  slider-color: "rgb(var(--color-blue))"
  slider-bar-color: "rgba(var(--color-blue),0.38)"
  # cards
  box-shadow: "0 2px 6px rgba(0, 0, 0, 0.15)"
  ha-card-box-shadow: "var(--box-shadow)"
  # sidebar
  sidebar-selected-text-color: "var(--google-red)"
  sidebar-selected-icon-color: "var(--google-red)"
  sidebar-text-color: "#80868b"
  # switch
  switch-checked-color: "var(--google-blue)"
  # media player
  mini-media-player-accent-color: "var(--google-blue)"
  
  honeycomb-menu-icon-color: rgb(var(--color-background-grey))
  honeycomb-menu-icon-active-color: rgb(var(--color-background-blue2))
  honeycomb-menu-background-color: rgba(var(--color-background-grey),0.4)
  honeycomb-menu-active-background-color: rgba(var(--color-background-blue2),0.8)
  honeycomb-menu-disabled: rgba(var(--primary-background-color),var(--opacity-bg))

  # Button-cards
  button-card-background: "rgba(255,255,255,0.08)"
  button-card-border: "rgba(255,255,255,0.22)"
  button-card-shadow: "rgba(0,0,0,0.1)"
  button-card-inset-shadow: "rgba(255,255,255,0.1)"
  button-card-icon: "white"
  button-card-icon-shadow: "rgba(0,0,0,0.4)"
  button-card-icon-active: "rgba(100, 180, 255, 0.9)"
  button-card-name: "white"
  button-card-label: "rgba(255,255,255,0.7)"
  button-card-before-gradient-start: "rgba(255,255,255,0.45)"
  button-card-before-gradient-mid: "rgba(255,255,255,0.1)"
  button-card-before-gradient-end: "rgba(255,255,255,0.02)"
  button-card-after-border: "rgba(255,255,255,0.18)"
  button-card-after-shadow: "rgba(255,255,255,0.08)"

  # Mod-card
  mod-card-background: "rgba(255,255,255,0.05)"
  mod-card-border: "rgba(255,255,255,0.25)"
  mod-card-shadow: "rgba(0,0,0,0.08)"       # lehký vnější stín
  mod-card-inset-shadow: "rgba(0,0,0,0.03)" # lehký vnitřní stín
  mod-card-gradient-start: "rgba(255,255,255,0.55)"
  mod-card-gradient-mid: "rgba(255,255,255,0.15)"
  mod-card-gradient-end: "rgba(255,255,255,0.05)"

  text-shadow: "2px 2px 4px rgba(0,0,0,0.1)"
  text-color: "#FFFFFF"
  
  macos-red: "#ff453a"
  macos-yellow: "#ffd60a"
  macos-blue: "#0a84ff"
  macos-green: "#32D74B"
  macos-gray: "#8E8E93"
  macos-orange: "#FF9500"

  macos-red-rgb: "255,69,58"
  macos-yellow-rgb: "255,214,10"
  macos-blue-rgb: "0,132,255"
  macos-green-rgb: "50,215,75"
  macos-gray-rgb: "142,142,147"
  macos-orange-rgb: "255,149,0"

  macos-red-background: rgba(255,69,58,0.68)
  macos-yellow-background: rgba(255,214,10,0.68)
  macos-blue-background: rgba(0,132,255,0.68)
  macos-green-background: rgba(50,215,75,0.68)
  macos-gray-background: rgba(142,142,147,0.68)
  macos-orange-background: rgba(255,149,0,0.68)
  macos-blueorange-background: rgba(255,149,0,0.68)

  color-background-macos-red: "var(--macos-red-rgb)"
  color-background-macos-yellow: "var(--macos-yellow-rgb)"
  color-background-macos-blue: "var(--macos-blue-rgb)"
  color-background-macos-green: "var(--macos-green-rgb)"
  color-background-macos-gray: "var(--macos-gray-rgb)"
  color-background-macos-orange: "var(--macos-orange-rgb)"