type: conditional
conditions:
  - condition: state
    entity: switch.energy_yearly_view
    state: "on"
card:
  type: custom:vertical-stack-in-card
  card_mod:
      style: |
        ha-card {
          background-color: transparent !important;
          box-shadow: none !important;
          max-height: 95% !important;
        }
  cards:
    ############################################################
    # Varianta pro den (před západem)
    ############################################################
    - type: conditional
      conditions:
        - condition: state
          entity: sun.sun
          state: "above_horizon"
      card:
        type: custom:config-template-card
        entities:
          - input_number.counter_graph
        card:
          type: custom:apexcharts-card
          graph_span: |
            [[[
              if (states['input_boolean.switch_current'].state == 'on' )
                return "1year";
            ]]]
          span:
            start: year

          stacked: true
          update_interval: 1h

          header:
            show: false

          series:
            ############################################################
            # Spotřeba – secondary (den)
            ############################################################
            - entity: sensor.pnd_data
              name: Spotřeba
              unit: kW
              type: column
              attribute: consumption
              data_generator: |
                return entity.attributes.pnddate.map((pnd, index) => {
                  return [new Date(pnd).getTime(), entity.attributes.consumption[index]];
                });
              color: "rgb(250,250,250)"   # světlá barva pro den
              opacity: 0.8
              invert: true
              group_by:
                func: sum
                duration: 1month
              show:
                legend_value: false
                name_in_header: false
                in_brush: true

            ############################################################
            # Přetoky / výroba – primary (den)
            ############################################################
            - entity: sensor.pnd_data
              name: Přetoky
              unit: kW
              type: column
              attribute: production
              data_generator: |
                return entity.attributes.pnddate.map((pnd, index) => {
                  return [new Date(pnd).getTime(), entity.attributes.production[index]];
                });
              color: "rgb(250,250,250)"   # oranžová pro den
              opacity: 0.7
              invert: false
              group_by:
                func: sum
                duration: 1month
              show:
                legend_value: false
                name_in_header: false
                in_brush: true

          apex_config:
            chart:
              type: area
              height: 252
              toolbar:
                show: false
              dropShadow:
                enabled: true
                enabledOnSeries: [0,1]
                top: 0
                left: 0
                blur: 4
                color: "#888"
                opacity: 0.35

            fill:
              type: gradient
              gradient:
                shadeIntensity: 0.1
                opacityFrom: 0.6
                opacityTo: 0.8
                inverseColors: true
                stops:
                  - 0
                  - 50
                  - 100

            yaxis:
              - labels: { show: false }
                axisBorder: { show: false }
                axisTicks: { show: false }

            xaxis:
              labels: { show: false }
              axisBorder: { show: false }
              axisTicks: { show: false }

            grid:
              show: false

            legend:
              show: false

            tooltip:
              enabled: true
              shared: true
              followCursor: true

          card_mod:
            style: |
              ha-card {
                background-color: transparent !important;
                box-shadow: none !important;
                max-height: 250px !important;
              }

    ############################################################
    # Varianta pro noc (po západu)
    ############################################################
    - type: conditional
      conditions:
        - condition: state
          entity: sun.sun
          state: "below_horizon"
      card:
        type: custom:config-template-card
        entities:
          - input_number.counter_graph
        card:
          type: custom:apexcharts-card
          graph_span: |
            [[[
              if (states['input_boolean.switch_current'].state == 'on' )
                return "1year";
            ]]]
          span:
            start: year

          stacked: true
          update_interval: 1h

          header:
            show: false

          series:
            ############################################################
            # Spotřeba – secondary (noc)
            ############################################################
            - entity: sensor.pnd_data
              name: Spotřeba
              unit: kW
              type: column
              attribute: consumption
              data_generator: |
                return entity.attributes.pnddate.map((pnd, index) => {
                  return [new Date(pnd).getTime(), entity.attributes.consumption[index]];
                });
              color: "rgb(0,120,230)"   # tmavší modrá pro noc
              opacity: 0.8
              invert: true
              group_by:
                func: sum
                duration: 1month
              show:
                legend_value: false
                name_in_header: false
                in_brush: true

            ############################################################
            # Přetoky / výroba – primary (noc)
            ############################################################
            - entity: sensor.pnd_data
              name: Přetoky
              unit: kW
              type: column
              attribute: production
              data_generator: |
                return entity.attributes.pnddate.map((pnd, index) => {
                  return [new Date(pnd).getTime(), entity.attributes.production[index]];
                });
              color: "rgb(0,120,230)"   # světlejší modrá pro noc
              opacity: 0.7
              invert: false
              group_by:
                func: sum
                duration: 1month
              show:
                legend_value: false
                name_in_header: false
                in_brush: true

          apex_config:
            chart:
              type: area
              height: 252
              toolbar:
                show: false
              dropShadow:
                enabled: true
                enabledOnSeries: [0,1]
                top: 0
                left: 0
                blur: 4
                color: "#888"
                opacity: 0.35

            fill:
              type: gradient
              gradient:
                shadeIntensity: 0.1
                opacityFrom: 0.6
                opacityTo: 0.8
                inverseColors: true
                stops:
                  - 0
                  - 50
                  - 100

            xaxis:
              labels: { show: false }
              axisBorder: { show: false }
              axisTicks: { show: false }

            grid:
              show: false

            legend:
              show: false

            tooltip:
              enabled: true
              shared: true
              followCursor: true

          card_mod:
            style: |
              ha-card {
                background-color: transparent !important;
                box-shadow: none !important;
                max-height: 250px !important;
              }
