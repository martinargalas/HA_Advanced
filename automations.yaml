- id: '1725035939325'
  alias: Alarm Kids
  description: ''
  triggers:
  - value_template: '{{ states(''sensor.time'') == states(''sensor.lightalarm_time_start'')
      }}'
    trigger: template
  conditions:
  - condition: and
    conditions:
    - condition: state
      entity_id: input_boolean.alarmed_toggle
      state: 'on'
    - condition: or
      conditions:
      - condition: state
        entity_id: input_select.lightalarm_mode
        state: Každý den
      - condition: state
        entity_id: input_select.lightalarm_mode
        state: Pouze jednou
      - condition: and
        conditions:
        - condition: state
          entity_id: input_select.lightalarm_mode
          state: Pracovní dny
        - condition: time
          weekday:
          - mon
          - tue
          - wed
          - thu
          - fri
  actions:
  - action: media_player.turn_off
    metadata: {}
    target:
      entity_id: media_player.kids2
    data: {}
  - delay:
      hours: 0
      minutes: 0
      seconds: 1
      milliseconds: 0
  - action: media_player.volume_set
    target:
      entity_id:
      - media_player.kids2
    data:
      volume_level: 0
  - data:
      media:
        media_content_id: http://192.168.4.99:8123/local/community/spotify/alarm_birds_sound.mp3
        media_content_type: music
        metadata: {}
    target:
      entity_id: media_player.kids2
    action: media_player.play_media
  - delay:
      hours: 0
      minutes: 0
      seconds: 1
      milliseconds: 0
  - action: media_player.volume_set
    target:
      entity_id:
      - media_player.kids2
    data:
      volume_level: 0.6
  - action: spotcast.start
    data:
      limit: 20
      force_playback: true
      random_song: false
      repeat: 'off'
      shuffle: false
      offset: 0
      ignore_fully_played: false
      device_name: Kids Room speaker
      entity_id: media_player.kids2
      uri: spotify:track:3gDWqFGcERIoACTxG49ktL?si=ecaac6559b7343ab
    enabled: false
  - action: cover.open_cover
    target:
      entity_id: cover.kids_room
    data: {}
  - delay:
      hours: 0
      minutes: 0
      seconds: 30
      milliseconds: 0
  - action: media_player.volume_set
    target:
      entity_id:
      - media_player.kids2
    data:
      volume_level: 0.3
  - action: media_player.turn_off
    target:
      entity_id:
      - media_player.kids2
    data: {}
  mode: single
- id: '1725036912442'
  alias: Blinds Close Bedroom Max
  description: ''
  triggers:
  - minutes: /5
    trigger: time_pattern
  conditions:
  - type: is_illuminance
    condition: device
    device_id: 17754b3f1158ddfdb68f8e4011f20ee4
    entity_id: 0582aba3aa514891966052919fff8b32
    domain: sensor
    above: 80000
  - condition: state
    entity_id: switch.bedroom_blinds_user_switch
    state: 'off'
  - condition: numeric_state
    entity_id: sun.sun
    attribute: azimuth
    above: 205
    below: 269.9
  actions:
  - if:
    - condition: state
      entity_id: cover.balcony
      state: closed
    then:
    - if:
      - condition: template
        value_template: '{% set n = now() %} {{ 3 <= n.month <= 11}}

          '
      - condition: numeric_state
        entity_id: sensor.e3_tcu10_x07_outside_temperature
        above: 25
      then:
      - target:
          entity_id: cover.balcony
        data:
          tilt_position: "{{ states('input_number.blinds_summer_max') | int }} \n"
        action: cover.set_cover_tilt_position
      else:
      - target:
          entity_id: cover.balcony
        data:
          tilt_position: "{{ states('input_number.blinds_winter_max') | int }} \n"
        action: cover.set_cover_tilt_position
    else:
    - target:
        entity_id: cover.balcony
      data: {}
      action: cover.close_cover
    - delay:
        hours: 0
        minutes: 1
        seconds: 0
        milliseconds: 0
    - if:
      - condition: template
        value_template: '{% set n = now() %} {{ 3 <= n.month <= 11}}

          '
      - condition: numeric_state
        entity_id: sensor.e3_tcu10_x07_outside_temperature
        above: 25
      then:
      - target:
          entity_id: cover.balcony
        data:
          tilt_position: "{{ states('input_number.blinds_summer_max') | int }} \n"
        action: cover.set_cover_tilt_position
      else:
      - target:
          entity_id: cover.balcony
        data:
          tilt_position: "{{ states('input_number.blinds_winter_max') | int }} \n"
        action: cover.set_cover_tilt_position
  mode: single
