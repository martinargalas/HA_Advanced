          tap_action:
            action: none
          features:
            - type: toggle
          color: "rgba(var(--color-background-theme), 0.5)"
          card_mod:
            style: |
              ha-card {
                background: none;
                box-shadow: none;
                border: none;
                margin-bottom: -18px;
              }
        
        - !include /config/ui_lovelace_minimalist/cards/bubble_cards/cleaning/robot_3a_Control.yaml