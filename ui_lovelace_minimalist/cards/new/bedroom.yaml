card_mod:
  style: |
    ha-card::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 26px;
      background: linear-gradient(
        120deg,
        var(--button-card-before-gradient-start),
        var(--button-card-before-gradient-mid) 30%,
        var(--button-card-before-gradient-end) 60%
      );
      opacity: 0.35;
      pointer-events: none;
    }
    ha-card::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 26px;
      box-shadow:
        inset 0 0 0 1.5px var(--button-card-after-border),
        inset 0 0 20px var(--button-card-after-shadow);
      pointer-events: none;
    } 