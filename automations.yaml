                - conditions:
                  - '{{ custom_action_auto_multi | length > 0 }}'
                  sequence: []
              - alias: Delay for Final Update
                choose:
                - conditions:
                  - '{{ event[''type''] == ''end'' }}'
                  - '{{ final_update }}'
                  sequence:
                  - delay:
                      seconds: '{{final_delay}}'
              - alias: Update Notification
