            }
            .shape {
              {{ '--shape-animation: ping 2s infinite;' if is_state(config.entity, 'on') }}
              background-color: 
                {% if is_state(config.entity, 'on') %}
                  rgba({{ glow_color }},0.15) !important;
                {% else %}
                  rgba(var(--color-grey),0.1) !important;
                {% endif %};
              position: relative;
              z-index: 3;   /* ikona bude nad vším */
            }
            :host {
              {% if is_state(config.entity, 'on') %}
                --card-mod-icon-color: rgb({{ glow_color }});   # ikona kopíruje den/noc
              {% else %}
