      state: >-
        {% set s = [
          states('switch.luba_vsqcfhrv_horni'),
          states('switch.luba_vsqcfhrv_spodni'),
          states('switch.luba_vsqcfhrv_prostredni'),
          states('switch.luba_vsqcfhrv_skalka'),
          states('switch.luba_vsqcfhrv_predzahradka'),
          states('switch.luba_vsqcfhrv_slepice'),
          states('switch.luba_vsqcfhrv_u_cesty_1'),
          states('switch.luba_vsqcfhrv_u_silnice')
        ] %}
        {% if 'on' in s %} on {% endif %}

    # =====================
    # OTHER
    # =====================

    - name: "apex_chart_color"
      state: >-
        {% if states('sun.sun') == 'above_horizon' %}
          rgb(128, 201, 148)
        {% elif states('sun.sun') == 'below_horizon' %}
          rgb(252, 214, 124)
        {% endif %}

    - name: "music_playing_bathroom"
      state: >-
        {% if states('media_player.bathroom') == 'playing' %}
          on
        {% else %}
          off
        {% endif %}

    - name: "something_playing_living_room"
      state: >-
        {% set app = state_attr('media_player.apple_tv_4k', 'app_name') %}
        {% set state = states('media_player.apple_tv_4k') %}
        {% set valid = [
          'Netflix',
          'YouTube',
          'Plex',
          'SledovaniTV',
          'overseerrTV'
        ] %}
        {% if app in valid and state == 'playing' %}
          on
        {% else %}
          off
        {% endif %}

    - name: "nameday"
      state: >-
        {{ state_attr('calendar.ceska_jmena', 'message') }}

    - name: "washer_remaining_time"
      state: >-
        {% set diff = as_timestamp(states('sensor.pracka_washer_completion_time')) - as_timestamp(now()) %}
        {% set h = (diff // 3600) | int %}
        {% set m = ((diff % 3600) // 60) | int %}
        {% if h == 1 %}
          {{ h }} hodina a {{ m }} minut
        {% elif h > 1 %}
          {{ h }} hodiny a {{ m }} minut
        {% else %}
          {{ m }} minut
        {% endif %}

    - name: "forecast_today"
      state: >-
        {{ state_attr('weather.forecast_domov', 'forecast')
           | selectattr('datetime', 'lt', now().replace(hour=11, minute=59).isoformat())
           | map(attribute='temperature')
           | list | max | round | int }}

    - name: "random_good_day"
      state: >-
        {{ ["Ať se vám dnes daří!", "Mějte úspěšný den!"] | random }}

    - name: "welcome_time_of_day"
      state: >-
        {% set h = now().hour + 2 %}
        {% if h < 12 %} Dobré ráno.
        {% elif h < 18 %} Dobré odpoledne.
        {% else %} Dobrý večer.
        {% endif %}

    - name: "day_in_week"
      state: >-
        {{ now().day }}

    - name: "month_number"
      state: >-
        {{ now().month }}

    - name: "day_in_week_name"
      state: >-
        {{ ["Pondělí","Úterý","Středa","Čtvrtek","Pátek","Sobota","Neděle"][now().weekday()] }}

    - name: "month_name"
      state: >-
        {{ ["leden","únor","březen","duben","květen","červen","červenec","srpen","září","říjen","listopad","prosinec"][now().month-1] }}

    - name: "desktopargi"
      state: >-
        {% if states('binary_sensor.martin_pc_power_martin_pc_power_status') == 'on' %}
          on
        {% else %}
          off
        {% endif %}






        