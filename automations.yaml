          někoho ze své paměti, jako je děda, babička, Ema, Ondra, Kristýna nebo Martin,
          neber tyto jako podezřelé a do své odpovědi napiš jejich jméno začínající
          velkým písmenem.  Příklad \"Martin\" nebo \"Děda\"\n\nPokud vidíš někoho,
          koho neznáš, popiš vzhled osoby a její oblečení ve 120 znacích.\n\nPokud
          na snímku nevidíš nikoho, ale přesto registruješ pohyb, napiš jednu větu
          \"Něco je před vchodem.\"\n\nPokud na snímku vidíš psa, napiš jedno slovo
          \"Gary\"\n\nPokud na snímku vidíš auto, napiš jedno slovo \"Auto\" Robotická
