  item1:
    card:
      type: "custom:button-card"
      show_name: false
      show_label: false
      show_icon: true
      label: "Sonos koupelna"
      entity: media_player.bedroom_speaker
      icon: mdi:speaker
      tap_action:
        action: toggle
      state:
      - value: "playing"
        styles:
          card:
            - background: var(--macos-blue-background)   
      - value: "off"
        styles:
          card:
            - background: none  
      styles:
        card:
          - border-radius: "42px"       
          - height: "52px"
          - width: "52px"
          - background: var(--button-card-background)
          - backdrop-filter: blur(20px) saturate(180%)
          - -webkit-backdrop-filter: blur(20px) saturate(180%)
          - border: 1px solid var(--button-card-border)
          - box-shadow:
              - 0 10px 25px var(--button-card-shadow)
              - inset 0 1px 1px var(--button-card-inset-shadow)
          - position: relative
          - overflow: hidden
          - transition: transform 0.25s ease
        icon:
          - width: 28px
          - color: var(--button-card-icon)
          - filter: drop-shadow(0 2px 6px var(--button-card-icon-shadow))

  item2:
    card:
      type: "custom:button-card"
      show_name: false
      show_label: false
      show_icon: true
      label: "Žaluzie"
      entity: cover.balcony
      icon: mdi:blinds-horizontal
      state:
      - value: "open"
        icon: mdi:blinds-horizontal
        styles:
          card:
            - background: none  
      - value: "closed"
        icon: mdi:blinds-horizontal-closed
        styles:
          card:
            - background: var(--macos-blue-background)   
      styles:
        card:
          - border-radius: "42px"       
          - height: "52px"
          - width: "52px"
          - background: var(--button-card-background)
          - backdrop-filter: blur(20px) saturate(180%)
          - -webkit-backdrop-filter: blur(20px) saturate(180%)
          - border: 1px solid var(--button-card-border)
          - box-shadow:
              - 0 10px 25px var(--button-card-shadow)
              - inset 0 1px 1px var(--button-card-inset-shadow)
          - position: relative
          - overflow: hidden
          - transition: transform 0.25s ease
        icon:
          - width: 28px
          - color: var(--button-card-icon)
          - filter: drop-shadow(0 2px 6px var(--button-card-icon-shadow))
          
      tap_action:
        action: call-service
        service: honeycomb   
        entity: cover.balcony
        service_data:
          entity_id: entity
          animation_speed: 25
          buttons:
            - icon: mdi:numeric-1-box
              active: >
                [[[
                  return (states['cover.balcony'].attributes.current_tilt_position <= states['sensor.blinds_tilt_determine_min_high'].state 
                  && states['cover.balcony'].attributes.current_tilt_position >= states['sensor.blinds_tilt_determine_min_low'].state) 
                  && states['cover.balcony'].state == "closed"
                  ? "True" : "1" == "1"
                ]]]
              tap_action:
                action: call-service
                service: script.tilt_blinds_bedroom_min
            - icon: mdi:numeric-2-box
              active: >
                [[[
                  return (states['cover.balcony'].attributes.current_tilt_position <= states['sensor.blinds_tilt_determine_mid_high'].state 
                  && states['cover.balcony'].attributes.current_tilt_position >= states['sensor.blinds_tilt_determine_mid_low'].state) 
                  && states['cover.balcony'].state == "closed"
                  ? "True" : "1" == "1"
                ]]]
              tap_action:
                action: call-service
                service: script.tilt_blinds_bedroom_mid
            - icon: mdi:numeric-3-box
              active: >
                [[[
                  return (states['cover.balcony'].attributes.current_tilt_position <= states['sensor.blinds_tilt_determine_max_high'].state 
                  && states['cover.balcony'].attributes.current_tilt_position >= states['sensor.blinds_tilt_determine_max_low'].state)
                  && states['cover.balcony'].state == "closed" 
                  ? "True" : "1" == "1"
                ]]]
              tap_action:
                action: call-service
                service: script.tilt_blinds_bedroom_max
            - icon: mdi:window-shutter-open
              active: >
                [[[
                  return (states['cover.balcony'].state == "open") ? "True" : "1" == "1"
                ]]]
              tap_action:
                action: call-service
                service: script.open_blinds_bedroom
            - icon: mdi:window-shutter
              active: >
                [[[
                  return (states['cover.balcony'].attributes.current_tilt_position == 0 && states['cover.balcony'].state == "closed") ? "True" : "1" == "1"
                ]]]
              tap_action:
                action: call-service
                service: script.close_blinds_bedroom
            - show: false
  

  

