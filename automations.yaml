                entered_new_filter_zones: '{{ zone_only and zones | length > 0 and
                  (new_entered_zones | length > last_entered_zones | length) }}'
                state_satisfied: '{{ not state_only or states(input_entity)|lower
                  in states_filter }}'
                before_sub_labels: '{{ sub_labels }}'
                sub_labels: '{{ event[''after''][''data''][''sub_labels''] | default([])
                  }}'
                label: "{% if update_sub_label %}\n  {% set data = namespace(labels=[])
                  %} \n  {% if labels|length %}\n    {% for obj in objects|select('in',
                  labels) %}\n      {% if \"-verified\" in obj %}\n      {% else %}\n
                  \       {% set data.labels = data.labels + [obj] %}\n      {% endif
                  %}\n    {% endfor %} {% set data.labels = data.labels + sub_labels
                  %} \n    {{ data.labels | unique | list | sort | join(\", \") |
                  title }}\n  {% else %}\n    {% for obj in objects %}\n      {% if
                  \"-verified\" in obj %}\n      {% else %}\n        {% set data.labels
                  = data.labels + [obj] %}\n      {% endif %}\n    {% endfor %} {%
                  set data.labels = data.labels + sub_labels %} \n    {{ data.labels
                  | unique | list | sort | join(\", \") | title }}\n  {% endif %}\n{%
                  else %}\n  {{objects | list | join(', ') | title}}\n{% endif %}"
                title: Kamera na zahradě
                message: ' '
                subtitle: '{{ llm_text.response_text }}'
                critical_input: 'false'
                critical: '{{ true if critical_input == ''true'' else true if critical_input
                  == True else false }}'
                tts: false
                sub_label_updated: '{{ update_sub_label and sub_labels != before_sub_labels
                  }}'
                zone_updated: '{{ (entered_new_filter_zones and zones_satisfied) or
                  entered_new_zones }}'
                object_updated: '{{ old_objects | select(''in'', labels) | list |
                  length  != objects | select(''in'', labels) | list | length }}'
                silent_update: '{{ alert_once or (not presence_changed and not zone_updated
                  and not object_updated and not sub_label_updated) }}'
                custom_action_auto_multi: []
            - choose:
              - conditions:
                - and:
                  - alias: Severity Filter
                    condition: template
                    value_template: '{{severity_satisfied}}'
                  - alias: Object Filter
                    condition: template
                    value_template: '{{ objects_satisfied }}'
                  - alias: Zone Filter
                    condition: template
                    value_template: '{{zones_satisfied}}'
                  - alias: State Filter
                    condition: template
                    value_template: '{{state_satisfied}}'
                  - alias: Custom Filter
                    condition: template
                    value_template: '{{custom_filter}}'
                  - alias: Presence Filter
                    condition: template
                    value_template: '{{not home}}'
                  - or:
                    - alias: Presence Changed
                      condition: template
                      value_template: '{{presence_changed}}'
                    - alias: Zone Changed
                      condition: template
                      value_template: '{{zone_updated}}'
                    - alias: Sub Label Changed
                      condition: template
                      value_template: '{{sub_label_updated}}'
                    - alias: Object Changed
                      condition: template
                      value_template: '{{object_updated}}'
                    - alias: Severity Changed
                      condition: template
                      value_template: '{{severity_updated}}'
                    - and:
                      - alias: Final Update
                        condition: template
                        value_template: '{{final_update}}'
                      - alias: End of Event
                        condition: template
                        value_template: '{{event[''type''] == ''end''}}'
                sequence:
                - alias: Custom Action Auto Multi
                  choose:
                  - conditions:
                    - condition: template
                      value_template: '{{ custom_action_auto_multi | length > 0 }}'
                    sequence: []
                - alias: Delay for Final Update
                  choose:
                  - conditions:
                    - condition: template
                      value_template: '{{ event[''type''] == ''end'' }}'
                    - condition: template
                      value_template: '{{ final_update }}'
                    sequence:
                    - delay:
                        seconds: '{{final_delay}}'
                - alias: Update Notification
                  sequence:
                  - action: notify.{{ notify_group_target }}
                    data:
                      title: '{{title}}'
                      message: '{{message}}'
                      data:
                        tag: '{{ id }}'
                        group: '{{ group }}'
                        color: '{{color}}'
                        subject: '{{subtitle}}'
                        image: '{{attachment}}'
                        video: '{{video}}'
                        clickAction: '{{tap_action}}'
                        ttl: 0
                        priority: high
                        alert_once: '{{ alert_once }}'
                        notification_icon: '{{icon}}'
                        sticky: '{{sticky}}'
                        channel: '{{''alarm_stream'' if critical else channel}}'
                        car_ui: '{{android_auto}}'
                        fontsize: '{{tv_size}}'
                        position: '{{tv_position}}'
                        duration: '{{tv_duration}}'
                        transparency: '{{tv_transparency}}'
                        interrupt: '{{tv_interrupt}}'
                        subtitle: '{{subtitle}}'
                        url: '{{tap_action}}'
                        icon: '{{ icon }}'
                        attachment:
                          url: '{{video if video else attachment }}'
                          content-type: '{{ ''application/vnd.apple.mpegurl'' if ''m3u8''
                            in video else ''mp4'' if ''mp4'' in video else ''jpeg''
                            if ''jpg'' in attachment else ''gif'' }}'
                        push:
                          sound:
                            name: '{{ iif(silent_update, ''none'', sound) }}'
                            volume: '{{ iif((silent_update or sound == ''none''),
                              0, volume) }}'
                            critical: '{{ iif(critical, 1, 0) }}'
                        entity_id: '{{ios_live_view}}'
                        actions:
                        - action: URI
                          title: '{{button_1}}'
                          uri: '{{url_1}}'
                          icon: '{{icon_1}}'
                        - action: URI
                          title: '{{button_2}}'
                          uri: '{{url_2}}'
                          icon: '{{icon_2}}'
                        - action: '{{ ''URI'' if ''/'' in url_3 else url_3 }}'
                          title: '{{button_3}}'
                          uri: '{{url_3}}'
                          icon: '{{icon_3}}'
                          destructive: true
                  - if:
                    - condition: template
                      value_template: '{{tts and (not tts_helper or not alert_once
                        or (tts_helper and id not in states(tts_helper)))}}'
                    then:
                      sequence:
                      - choose:
                        - conditions: '{{ not notify_group_target }}'
                          sequence:
                          - device_id: 56842dd78a3dd4d8c1531c1b04732d25
                            domain: mobile_app
                            type: notify
                            message: '{{''TTS''}}'
                            data:
                              tag: '{{ id }}{{''-loitering-tts'' if loitering}}'
                              channel: '{{''alarm_stream'' if critical else channel}}'
                              alert_once: '{{ alert_once }}'
                              tts_text: '{{message}}'
                        default:
                        - action: notify.{{ notify_group_target }}
                          data:
                            message: '{{''TTS''}}'
                            data:
                              tag: '{{ id }}{{''-loitering-tts'' if loitering}}'
                              channel: '{{''alarm_stream'' if critical else channel}}'
                              alert_once: '{{ alert_once }}'
                              tts_text: '{{message}}'
                      - action: input_text.set_value
                        data:
                          value: '{% set newIds = id + ''|'' + states(tts_helper)
                            %}

                            {{ newIds[:250] }}

                            '
                        target:
                          entity_id: '{{tts_helper}}'
            until:
            - condition: template
              value_template: '{{ not wait.trigger or wait.trigger.payload_json[''type'']
                == ''end'' }}'
          enabled: true
      default: []
    enabled: true
  trigger_variables:
    mqtt_topic: frigate/reviews
  variables:
    input_camera:
    - camera.garden_2
    input_camera_name: '{{input_camera|expand|map(attribute=''attributes.camera_name'',
      default=''none'')|list}}'
    camera: '{{trigger.payload_json[''after''][''camera''] if trigger.id == ''frigate-event''}}'
    camera_name: '{{ camera | replace(''_'', '' '') | title }}'
    input_severity:
    - alert
    - detection
    severity: '{{trigger.payload_json[''after''][''severity''] if trigger.id == ''frigate-event''}}'
    type: '{{trigger.payload_json[''type''] if trigger.id == ''frigate-event''}}'
    input_base_url: ''
    base_url: '{{ input_base_url.rstrip(''/'')}}'
    input_telegram_base_url: ''
    telegram_base_url: '{{ input_telegram_base_url.rstrip(''/'') if input_telegram_base_url
      else base_url }}'
    update_sub_label: false
    input_client_id: ''
    client_id: '{{input_client_id if not input_client_id else ''/'' + input_client_id
      if ''/'' not in input_client_id else input_client_id }}'
    alert_once: true
    final_update: true
    ios_live_view: ''
    android_auto: false
    notify_group: mobiledevicegroup
    notify_group_target: '{{ notify_group | lower | regex_replace(''^notify\.'', '''')
      | replace('' '',''_'') }}'
    telegram_chat_id: ''
    telegram: '{{true if (telegram_chat_id | length > 0) else false}}'
    zone_only: false
    input_zones: []
    zones: '{{ input_zones }}'
    zone_multi: false
    zone_order_enforced: false
    input_labels: ''
    labels: '{{ input_labels | list | lower }}'
    presence_entity:
    - ''
    disable_times: []
    cooldown: 0
    timeout: 2
    loitering: false
    loiter_timer: 0
    initial_delay: 0
    final_delay: 5
    fps: '{{ states(''sensor.'' + camera + ''_camera_fps'')|int(5) }}'
    state_only: false
    input_entity: ''
    input_states: []
    states_filter: '{{ input_states | list | lower }}'
    custom_filter: true
    color: '#8bc34a'
    sound: default
    input_volume: 100
    volume: '{{ (1 * input_volume|int(100))/100 }}'
    sticky: false
    tv: false
    tv_position: center
    tv_size: large
    tv_duration: 10
    tv_transparency: 0%
    tv_interrupt: false
    debug: false
    redacted: false
    master_condition: []
    severity_satisfied: '{{input_severity|select(''in'', severity)|list|length > 0
      if trigger.id == ''frigate-event''}}'
    objects: '{{ trigger.payload_json[''after''][''data''][''objects''] if trigger.id
      == ''frigate-event'' }}'
    objects_satisfied: '{{ not labels|length or labels|select(''in'', objects)|list|length
      > 0 or (''person-verified'' in objects and ''person'' in labels) }}'
    initial_home: '{{ presence_entity != '''' and presence_entity|expand|selectattr(''state'',''eq'',''home'')|list|length
      != 0 }}'
    state_satisfied: '{{ not state_only or states(input_entity)|lower in states_filter
      }}'
    before_zones: '{{ trigger.payload_json[''before''][''data''][''zones''] if trigger.id
      == ''frigate-event'' }}'
    after_zones: '{{ trigger.payload_json[''after''][''data''][''zones''] if trigger.id
      == ''frigate-event'' }}'
    zone_multi_filter: '{{zone_only and zone_multi and after_zones|length and zones
      and zones |reject(''in'', after_zones) |list |length == 0 }}'
  mode: parallel
  max: 10
