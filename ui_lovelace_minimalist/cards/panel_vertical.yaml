view_layout:
  grid-area: "panel_vertical"     
  place-self: left end stretch
type: custom:stack-in-card
mode: vertical
card_mod:
  style: |
    ha-card {
      height: 600px;
      border-radius: 34px;
      padding: 20px;
      background: var(--mod-card-background);
      backdrop-filter: blur(35px) saturate(100%);
      -webkit-backdrop-filter: blur(35px) saturate(200%);
      border: 1px solid var(--mod-card-border);
      box-shadow: 
        0 15px 25px var(--mod-card-shadow), 
        inset 0 2px 3px var(--mod-card-inset-shadow);
    }
cards:
  - type: picture-elements
    elements:
      - type: state-label
        entity: sensor.time
        style:
          font-family: "Roboto"
          font-size: 800%
          color: var(--text-color)
          left: 150px
          top: 44px
          pointer-events: none
          font-weight: 300
          letter-spacing: -0.02em
          text-shadow: var(--text-shadow)
        card:
          - width: 100px

    image: "/local/community/spotify/1.png"
    card_mod:
      style: |
        ha-card {
          background: transparent !important; 
          box-shadow: none !important;  
        }
  
  - type: custom:bubble-card
    card_type: separator
    name: ""
    icon: none
    card_layout: normal
    card_mod:
      style: |
        ha-card {
          width: 350px !important;
          left: -40px !important;
          top: -10px !important;
          --bubble-line-background-color: var(--text-color) !important;
        }

  - type: custom:clock-weather-card
    entity: weather.home
    sun_entity: sun.sun
    weather_icon_type: fill
    animated_icon: true
    hide_today_section: false
    hide_forecast_section: true
    hide_clock: true
    hide_date: true
    tap_action:
      action: none
    card_mod:
      style: |
        ha-card {
          background-color: rgba(var(--color-black),0.0) !important;
          box-shadow: none !important;
          top: -40px !important;
          font-weight: 400 !important;
          text-shadow: var(--text-shadow) !important;
        }
        ha-card * {
          color: var(--text-color) !important;
          font-family: "Roboto", sans-serif !important;

          text-shadow: var(--text-shadow) !important;
        }

  - type: custom:clock-weather-card
    entity: weather.home
    sun_entity: sun.sun
    weather_icon_type: fill
    animated_icon: true
    forecast_rows: 5
    hide_today_section: true
    hide_forecast_section: false
    hide_clock: true
    hide_date: true
    tap_action:
      action: none
    hourly_forecast: true
    card_mod:
      style: |
        ha-card {
          background-color: rgba(var(--color-black),0.0) !important;
          box-shadow: none !important;
          text-shadow: var(--text-shadow) !important;
          font-weight: 400 !important;
          top: -80px !important;
        }
        ha-card * {
          color: var(--text-color) !important;
          font-family: "Roboto", sans-serif !important;
          font-weight: 400 !important;
          text-shadow: var(--text-shadow) !important;
        }

  - type: custom:bubble-card
    card_type: separator
    name: ""
    icon: none
    card_layout: normal
    card_mod:
      style: |
        ha-card {
          width: 350px !important;
          left: -40px !important;
          top: -90px !important;
          --bubble-line-background-color: var(--text-color) !important;
        }

  - type: custom:atomic-calendar-revive
    name: 
    showLoader: true
    enableModeChange: true
    card_mod:
      style: |       
        ha-card {
          max-height: 300px !important;
          top: -110px !important;
          background: none !important;
          box-shadow: none !important;
          font-family: "Roboto", sans-serif !important;
          font-weight: 300 !important;
        }
        .event-title {
          color: var(--text-color) !important;
          font-weight: 400 !important;
        }
        .event-date-day {
          color: var(--text-color) !important;
          font-weight: 400 !important;
        }
        .time-remaining {
          color: var(--text-color) !important;
          font-weight: 400 !important;
        }
        ha-icon.event-icon {
          color: var(--text-color) !important;
        }
        .event-icon {
          margin-right: 5px !important;
        }
        .single-event-container {
          grid-template-columns: 0.6fr 2fr !important;
        }
        .cal-eventContainer {
          color: var(--text-color) !important;
        }
    entities:
      - entity: automation.refresh_calendar
        icon: ''
      - entity: calendar.family
        name: Family
        maxDaysToShow: 3
      - entity: calendar.utilities
        name: Utilities
        maxDaysToShow: 3
      - entity: calendar.ceske_statni_svatky
        name: České státní svátky
        
    defaultMode: Event
    showHiddenText: true
    showEventIcon: true
    calShowDescription: false
    disableCalEventLink: false
    showLastCalendarWeek: false
    disableCalLink: false
    dimFinishedEvents: true
    showRelativeTime: false
    showDate: false
    showCurrentEventLine: false
    showMonth: true
    showHours: false
    showWeekDay: true
    showDescription: false
    disableLocationLink: false
    showNoEventsForToday: false
    showFullDayProgress: false
    showCalendarName: false
    showWeekNumber: false
    showEventDate: true
    showDatePerEvent: false
    showAllDayHours: false
    hoursOnSameLine: false
    maxDaysToShow: 3
    showTimeRemaining: false
    disableEventLink: false
  

      
