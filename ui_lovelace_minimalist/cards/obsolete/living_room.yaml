view_layout:
  grid-area: "living_room"     
  place-self: left end stretch
type: 'custom:button-card'
template:
  - card_room
  - yellow_on
  - grey_no_state       
name: Obývací pokoj
entity: light.living_room
icon: mdi:sofa
variables:
  label_use_temperature: false
  label_use_brightness: true
  tap_action:
    action: toggle
  entity_1:
    entity_id: light.living_room
    templates:
      - yellow_on
    tap_action:
      action: toggle
  entity_2:
    entity_id: media_player.shield_2
    templates:
      - blue_on
    tap_action:
      action: call-service
      service: script.living_room_tv
      data: {}
label: >
    [[[
      return "🌡️" + Math.round((states['sensor.temperature_sensor_4'].state) * 100) / 100 + " °C" + "💧" + states['sensor.temperature_sensor_humidity_sensor_4'].state + " %"
    ]]]
