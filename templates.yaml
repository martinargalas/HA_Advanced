- sensor:
    - name: "Portainer Containers Status"
      state: >
        {% set stopped = state_attr('sensor.portainer_endpoints_local', 'Stoppedcontainercount') | int %}
        {% set unhealthy = state_attr('sensor.portainer_endpoints_local', 'Unhealthycontainercount') | int %}

        {% if stopped == 0 and unhealthy == 0 %}
          running
        {% elif unhealthy > 0 %}
          unhealthy
        {% else %}
          stopped
        {% endif %}

    - name: Day or Night
      state: >
        {% if is_state('sun.sun', 'above_horizon') %}
          day
        {% else %}
          night
        {% endif %}

