view_layout:
  grid-area: "washer"
type: custom:vertical-stack-in-card
cards:
- type: "custom:button-card"
  template: "custom_card_haven_washer"
  variables:
    ulm_custom_card_washer_power: binary_sensor.pracka_power
    ulm_custom_card_washer_remote_control: sensor.pracka_remote_control
    ulm_custom_card_washer_machine_state: sensor.pracka_washer_machine_state
    ulm_custom_card_washer_job_state: sensor.pracka_washer_job_state
    ulm_custom_card_washer_job_states:
      state1:
        name: "weightSensing"
        icon: "mdi:scale"
      state2:
        name: "wash"
        icon: "mdi:waves"
      state3:
        name: "rinse"
        icon: "mdi:water"
      state4:
        name: "spin"
        icon: "mdi:fan"
    ulm_custom_card_washer_delayed_start: input_boolean.washingmachine_latest_start
    ulm_custom_card_washer_delayed_starttime: input_datetime.washingmachine_latest_starttime
    ulm_custom_card_washer_label_idle: >
      [[[
        var name = states["sensor.pracka_energy"].attributes.friendly_name;
        var value = states["sensor.pracka_energy"].state;
        var measurement = states["sensor.pracka_energy"].attributes.unit_of_measurement;
        if (states["binary_sensor.pracka_power"].state == "on")
        return "Spuštěno. Program skončí za " + states["sensor.washer_remaining_time"].state + ".";
        else
        return "Vypnuto";
      ]]]
    ulm_custom_card_washer_label_running: >
      [[[ 
          return states["sensor.washer_remaining_time"].state; 
      ]]]
    ulm_custom_card_washer_start_action:
      action: "call-service"
      service: switch.turn_on
      service_data:
        entity_id: switch.washer_run_action
    ulm_custom_card_washer_pause_action:
      action: "call-service"
      service: switch.turn_on
      service_data:
        entity_id: switch.washer_pause_action
    ulm_custom_card_washer_stop_action:
      action: "call-service"
      service: switch.turn_on
      service_data:
        entity_id: sensor.pracka_washer_machine_state

  card_mod:
    style: |
      ha-card {
        background: transparent !important;
      }
      
card_mod:
  style: |
    ha-card {
      border-radius: 34px;
      background: var(--mod-card-background);
      backdrop-filter: blur(35px) saturate(100%);
      -webkit-backdrop-filter: blur(35px) saturate(200%);
      border: 1px solid var(--mod-card-border);
      box-shadow: 
        0 15px 25px var(--mod-card-shadow), 
        inset 0 2px 3px var(--mod-card-inset-shadow);
    }

    ha-card::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 34px;
      background: linear-gradient(
        120deg,
        var(--mod-card-gradient-start),
        var(--mod-card-gradient-mid) 25%,
        var(--mod-card-gradient-end) 50%,
        transparent 70%
      );
      opacity: 0.35;
      pointer-events: none;
    }