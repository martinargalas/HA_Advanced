    # --- VIRTUAL BATTERY ---

    - name: "energy_virtual_batery_day"
      state: >-
        {{ (states('sensor.energy_buy_daily') | float
            - states('sensor.energy_sell_daily') | float) | round(1) }}
      unit_of_measurement: "kWh"

    - name: "energy_virtual_batery_month"
      state: >-
        {{ (states('sensor.energy_buy_monthly') | float
            - states('sensor.energy_sell_monthly') | float) | round(1) }}
      unit_of_measurement: "kWh"

    - name: "energy_virtual_batery_year"
      state: >-
        {{ (states('sensor.energy_buy_yearly') | float
            - states('sensor.energy_sell_yearly') | float) | round(1) }}
      unit_of_measurement: "kWh"

    - name: "energy_virtual_batery2"
      state: >-
        {% set value = 0 %}
        {% if is_state('switch.energy_daily_view', 'on') %}
          {% set value = 1 - ((states('sensor.energy_sell_daily') | float | abs)
                              - states('sensor.energy_buy_daily') | float) %}
        {% elif is_state('switch.energy_monthly_view', 'on') %}
          {% set value = 1 - ((states('sensor.energy_sell_monthly') | float | abs)
                              - states('sensor.energy_buy_monthly') | float) %}
        {% elif is_state('switch.energy_yearly_view', 'on') %}
          {% set value = (states('sensor.energy_sell_yearly') | float - 931)
                        - (states('sensor.energy_buy_yearly') | float - 1361) %}
        {% endif %}
        {{ value }}
      unit_of_measurement: "kWh"

    - name: "energy_effectivity"
      state: >-
        {% set value = 0 %}
        {% if is_state('switch.energy_daily_view', 'on') %}
          {% set value = (1 - (states('sensor.energy_sell_daily') | float | abs
                              / states('sensor.energy_consumption_daily') | float)) * 100 %}
        {% elif is_state('switch.energy_monthly_view', 'on') %}
          {% set value = (1 - (states('sensor.energy_sell_monthly') | float | abs
                              / states('sensor.energy_consumption_monthly') | float)) * 100 %}
        {% elif is_state('switch.energy_yearly_view', 'on') %}
          {% set value = (1 - (states('sensor.energy_sell_yearly') | float | abs
                              / states('sensor.energy_consumption_yearly') | float)) * 100 %}
        {% endif %}
        {{ value | int }}
      unit_of_measurement: "%"


