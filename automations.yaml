  description: ''
  triggers:
  - trigger: time
    at: 07:10:00
    weekday:
    - mon
    - tue
    - wed
    - thu
    - fri
  conditions: []
  actions:
  - action: media_player.volume_set
    metadata: {}
    target:
      device_id: ae50bd762f43b9cf4e4479c0b9934e60
    data:
      volume_level: 0.3
  - data:
      message: Děti, za deset minut jdete do školy! Máte už všechno nachystáno?
      chime_path: chime
    target:
      entity_id:
      - media_player.office
    action: chime_tts.say
  mode: single
- id: '1773759126631'
  alias: KidsStarProjector
  description: ''
  triggers:
  - trigger: time
    at: '20:00:00'
    weekday:
    - mon
    - tue
    - wed
    - thu
    - fri
    - sat
    - sun
    id: 'on'
  - trigger: time
    at: '22:30:00'
    weekday:
    - mon
    - tue
    - wed
    - thu
    - fri
    - sat
    - sun
    id: 'off'
  conditions: []
  actions:
  - if:
    - condition: trigger
      id:
      - 'on'
    then:
    - action: input_boolean.turn_on
      metadata: {}
      target:
        entity_id: input_boolean.star_projector
      data: {}
    - action: scene.turn_on
      metadata: {}
      target:
        entity_id: scene.stars_on
      data: {}
  - if:
    - condition: trigger
      id:
      - 'off'
    then:
    - action: input_boolean.turn_off
      metadata: {}
      data: {}
      target:
        entity_id: input_boolean.star_projector
    - action: scene.turn_on
      metadata: {}
      target:
        entity_id: scene.stars_off
      data: {}
  mode: single
- id: '1773759526550'
  alias: KidsStarProjectorButtonToggle
  description: Spouští scény při přepnutí tlačítka na dashboardu
  triggers:
  - entity_id: input_boolean.star_projector
    trigger: state
  actions:
  - choose:
    - conditions:
      - condition: state
        entity_id: input_boolean.star_projector
        state: 'on'
      sequence:
      - target:
          entity_id: scene.stars_on
        action: scene.turn_on
    - conditions:
      - condition: state
        entity_id: input_boolean.star_projector
        state: 'off'
      sequence:
      - target:
          entity_id: scene.stars_off
        action: scene.turn_on
  mode: single
- id: '1774776512186'
  alias: PS5 - Reset manual
  description: ''
  triggers:
  - device_id: 0e93f0cb979fddffa32c3dd9e6522ac1
    domain: homekit_controller
    type: button1
    subtype: long_press
    trigger: device
  conditions: []
  actions:
  - target:
      entity_id: input_number.ps5_play_time_today
    data:
      value: 0
    action: input_number.set_value
  mode: single
