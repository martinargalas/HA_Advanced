  - type: custom:vertical-stack-in-card
    card_mod:
      style: |
        ha-card {
            background-color: transparent;
            box-shadow: none;
          }
    cards:
      - type: custom:bubble-card
        card_type: separator
        name: Teplota v topení
        icon: mdi:thermometer
        rows: 1
        styles: |
          .bubble-line {
            background: var(--primary-text-color);
            opacity: 0.1;
          }
        card_mod:
          style: |
            ha-card {
                background-color: transparent;
                box-shadow: none;
                color: var(--text-color);
              }

      - type: custom:stack-in-card
        mode: vertical
        card_mod:
          style: |
            ha-card {
                background-color: transparent;
                box-shadow: none;
              }
        cards:

          ############################################################
          # SPODNÍ GRAF – e3_tcu10_x07_supply_temperature
          ############################################################
          - type: custom:mini-graph-card
            entities:
              - entity: sensor.e3_tcu10_x07_supply_temperature
                show_fill: true
                show_line: true
            hours_to_show: 12
            points_per_hour: 4
            line_width: 4
            decimals: 1
            tap_action:
              action: none
            line_color: var(--graph-color1)
            show:
              name: false
              icon: false
              state: true
              labels: false
              legend: false
            card_mod:
              style: |
                {% set sun_state = states('sun.sun') %}
                {% set graph_color = 'var(--color-background-theme-secondary)' %}
                ha-card {
                  --graph-color1: rgb({{ graph_color }});
                  background: none;
                  box-shadow: none;
                  border: none;
                  opacity: 0.9;
                  position: relative;
                  z-index: 2;
                  margin-top: -10px;

                  mask-image: linear-gradient(
                    to right,
                    rgba(0,0,0,0) 0%,
                    rgba(0,0,0,1) 10%,
                    rgba(0,0,0,1) 90%,
                    rgba(0,0,0,0) 100%
                  );

                  filter:
                    drop-shadow(0 0 4px rgba({{ graph_color }},0.35))
                    drop-shadow(0 0 6px rgba({{ graph_color }},0.18));
                }

                ha-card .state {
                  font-size: 0.7rem;
                  font-weight: 600;
                  position: absolute;      /* potřebné, aby right fungovalo */
                  right: 30px;             /* odsazení od pravého okraje */
                  top: 10px;               /* odsazení od horního okraje */
                  left: auto;
                  text-align: right;       /* aby text byl opravdu vpravo */
                  color: var(--text-color);
                }

          ############################################################
          # HORNÍ GRAF – heating_on
          ############################################################
          - type: custom:mini-graph-card
            entities:
              - entity: sensor.heating_on
                show_fill: false
                show_line: true
                y_axis: secondary
            hours_to_show: 12
            points_per_hour: 4
            line_width: 3
            decimals: 1
            tap_action:
              action: none
            line_color: var(--graph-color2)
            show:
              name: false
              icon: false
              state: false
              labels: false
              legend: false
            card_mod:
              style: |
                {% set sun_state = states('sun.sun') %}
                {% set graph_color = 'var(--color-background-theme)' %}
                ha-card {
                  --graph-color2: rgb({{ graph_color }});
                  background: none;
                  box-shadow: none;
                  border: none;
                  opacity: 0.7;
                  position: relative;
                  top: -13px;
                  z-index: 1;
                  margin-top: -100%;  /* překrytí spodního grafu */
                  var(--text-color);

                  mask-image: linear-gradient(
                    to right,
                    rgba(0,0,0,0) 0%,
                    rgba(0,0,0,1) 10%,
                    rgba(0,0,0,1) 90%,
                    rgba(0,0,0,0) 100%
                  );

                  filter:
                    drop-shadow(0 0 4px rgba({{ graph_color }},0.35))
                    drop-shadow(0 0 6px rgba({{ graph_color }},0.18));
                }

      - type: custom:bubble-card
        card_type: separator
        name: Teplota vody
        icon: mdi:thermometer-water
        rows: 1
        styles: |
          .bubble-line {
            background: var(--primary-text-color);
            opacity: 0.1;
          }
        card_mod:
          style: |
            ha-card {
                background-color: transparent;
                box-shadow: none;
                color: var(--text-color);
              }

      - type: custom:stack-in-card
        mode: vertical
        card_mod:
          style: |
            ha-card {
                background-color: transparent;
                box-shadow: none;
              }
        cards:

          ############################################################
          # SPODNÍ GRAF – current_water_temperature
          ############################################################
          - type: custom:mini-graph-card
            entities:
              - sensor.current_water_temperature
            hours_to_show: 12
            points_per_hour: 4
            line_width: 4
            decimals: 1
            tap_action:
              action: none
            line_color: var(--graph-color1)
            show:
              name: false
              icon: false
              state: true
              labels: false
              legend: false
            card_mod:
              style: |
                {% set sun_state = states('sun.sun') %}
                {% set graph_color = 'var(--color-background-theme-secondary)' %}
                ha-card {
                  --graph-color1: rgb({{ graph_color }});
                  background: none;
                  box-shadow: none;
                  border: none;
                  opacity: 0.9;
                  position: relative;
                  margin-top: -10px;
                  z-index: 2;
                  color: var(--text-color);

                  mask-image: linear-gradient(
                    to right,
                    rgba(0,0,0,0) 0%,
                    rgba(0,0,0,1) 10%,
                    rgba(0,0,0,1) 90%,
                    rgba(0,0,0,0) 100%
                  );

                  filter:
                    drop-shadow(0 0 4px rgba({{ graph_color }},0.35))
                    drop-shadow(0 0 6px rgba({{ graph_color }},0.18));
                }

                ha-card .state {
                  font-size: 0.7rem;
                  font-weight: 600;
                  position: absolute;      /* potřebné, aby right fungovalo */
                  right: 30px;             /* odsazení od pravého okraje */
                  top: 10px;               /* odsazení od horního okraje */
                  left: auto;
                  text-align: right;       /* aby text byl opravdu vpravo */
                }

          ############################################################
          # HORNÍ GRAF – water_temperature
          ############################################################
          - type: custom:mini-graph-card
            entities:
              - sensor.water_temperature
            hours_to_show: 12
            points_per_hour: 4
            line_width: 3
            show_fill: false
            decimals: 1
            tap_action:
              action: none
            line_color: var(--graph-color2)
            show:
              name: false
              icon: false
              state: false
              labels: false
              legend: false
            card_mod:
              style: |
                {% set sun_state = states('sun.sun') %}
                {% set graph_color = 'var(--color-background-theme)' %}
                ha-card {
                  --graph-color2: rgb({{ graph_color }});
                  background: none;
                  box-shadow: none;
                  border: none;
                  opacity: 0.7;
                  margin-top: -100%;        /* překrytí */
                  position: relative;
                  top: -13px;
                  z-index: 1;
                  color: var(--text-color);

                  mask-image: linear-gradient(
                    to right,
                    rgba(0,0,0,0) 0%,
                    rgba(0,0,0,1) 10%,
                    rgba(0,0,0,1) 90%,
                    rgba(0,0,0,0) 100%
                  );

                  filter:
                    drop-shadow(0 0 4px rgba({{ graph_color }},0.35))
                    drop-shadow(0 0 6px rgba({{ graph_color }},0.18));
                }
