    - name: "day_month_name_shifted"
      state: >-
        {% set date = now().date() %} 
        {% set offset = (states['input_number.counter_graph'].state)|int %}
        {% set dayView = states['switch.energy_daily_view'].state %}
        {% set monthlyView = states['switch.energy_monthly_view'].state %}
        {% set yearlyView = states['switch.energy_yearly_view'].state %}
        {% set startDateForCalculation = now().date() %} 

        {% set viewType = "" %}

        {% set dayName = as_datetime(date).strftime('%a') %}
        {% set result = "" %}

        {% if dayView == "on" %}
          {% set viewType = "Day" %}
        {% elif monthlyView == "on" %}
          {% set viewType = "Month" %}
        {% elif yearlyView == "on" %}
          {% set viewType = "Year" %}
        {% endif %}

        {% if viewType == "Day"%}
          {% set date =  date + timedelta(days=offset)%}
          {% set dateOriginal = date.strftime('%d.%m.') %}
          {% set day = ["Neděle", "Pondělí", "Úterý", "Středa", "Čtvrtek", "Pátek", "Sobota"] %}
          {% set result = (day[as_timestamp(date) | timestamp_custom('%w', true) | int ])+ " " + dateOriginal  %}
        {% elif viewType == "Month" %}
          {% set monthCurrent = now().date().month%}
          {% set monthForCalculation = monthCurrent %}
          {% set tempMonthHelper = monthCurrent %}
          {% set yearForCalculation = now().date().year%}

          {% if ((monthCurrent) + states['input_number.counter_graph'].state|int) <= 0 %}
            {% set monthForCalculation = 12 %}
            {% set tempMonthHelper = 12 %}
          {% endif %}
          {%if tempMonthHelper == 12 and (monthForCalculation + monthCurrent <= 12 )%}
            {% set monthForCalculation = monthForCalculation + monthCurrent + states['input_number.counter_graph'].state|int %}
            {% set yearForCalculation = yearForCalculation-1 %}
            {% set startDateForCalculation = startDateForCalculation.replace(year=yearForCalculation, month=monthForCalculation, day=1) %}
            {% set daysInMonth = (startDateForCalculation.replace(month=startDateForCalculation.month % 12 + 1, day=1) - timedelta(days=1)).day%}

          {% else %}
            {% set monthForCalculation = monthForCalculation + states['input_number.counter_graph'].state|int %}
            {% set startDateForCalculation = startDateForCalculation.replace(year=yearForCalculation, month=monthForCalculation, day=1) %}
            {% set daysInMonth = (startDateForCalculation.replace(month=startDateForCalculation.month % 12 + 1, day=1) - timedelta(days=1)).day%}

          {% endif %}

          {% set date = date.replace(day=daysInMonth) %}
          {% set date = date.replace(month=monthForCalculation) %}
          {% set month = ["Prosinec","Leden", "Únor", "Březen", "Duben", "Květen", "Červen", "Červenec", "Srpen", "Září", "Říjen", "Listopad", "Prosinec"] %}
          {% set result = month[as_timestamp(date) | timestamp_custom('%m', false) | int ] %}

        {% elif viewType == "Year" %}
          {% set result = now().date().year + states['input_number.counter_graph'].state|int %}
        {% endif %}
        {{result}}

