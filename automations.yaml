                      attachment:
                        url: '{{video if video else attachment }}'
                        content-type: '{{ ''application/vnd.apple.mpegurl'' if ''m3u8''
                          in video else ''mp4'' if ''mp4'' in video else ''jpeg''
                          if ''jpg'' in attachment else ''gif'' }}'
                      push:
                        sound:
                          name: '{{ iif(silent_update, ''none'', sound) }}'
                          volume: '{{ iif((silent_update or sound == ''none''), 0,
                            volume) }}'
                          critical: '{{ iif(critical, 1, 0) }}'
                      entity_id: '{{ios_live_view}}'
                      actions:
                      - action: URI
                        title: '{{button_1}}'
                        uri: '{{url_1}}'
                        icon: '{{icon_1}}'
                      - action: URI
                        title: '{{button_2}}'
                        uri: '{{url_2}}'
                        icon: '{{icon_2}}'
                      - action: '{{ ''URI'' if ''/'' in url_3 else url_3 }}'
                        title: '{{button_3}}'
                        uri: '{{url_3}}'
                        icon: '{{icon_3}}'
                        destructive: true
          until: '{{ not wait.trigger or wait.trigger.payload_json[''type''] == ''end''
            }}'
