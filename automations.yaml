- id: '1730301882459'
  alias: Luba Notification
  description: ''
  triggers:
  - trigger: numeric_state
    entity_id:
    - sensor.luba_vsqcfhrv_progress
    above: 99.99
    id: complete
  - trigger: state
    entity_id:
    - lawn_mower.luba_vsqcfhrv
    to: paused
    id: error
    enabled: false
  - trigger: state
    entity_id:
    - lawn_mower.luba_vsqcfhrv
    to: returning
    id: returning
    enabled: false
  - trigger: state
    entity_id:
    - binary_sensor.luba_vsqcfhrv_charging
    to: 'on'
    id: charging
    enabled: false
  conditions: []
  actions:
  - if:
    - condition: trigger
      id:
      - error
    - condition: state
      entity_id: binary_sensor.luba_vsqcfhrv_charging
      state: 'off'
    then:
    - action: notify.mobiledevicegroup
      data:
        message: Sekačka narazila na překážku
        title: Luba
        data:
          notification_icon: mdi:mower
          priority: high
          color: red
          image: /local/community/spotify/luba.png
  - if:
    - condition: trigger
      id:
      - complete
    then:
    - action: notify.mobiledevicegroup
      metadata: {}
      data:
        message: Sečení dokončeno
        title: Luba
        data:
          notification_icon: mdi:mower
          priority: high
          color: blue
          image: /local/community/spotify/luba.png
    - action: script.luba_reset_settings
      data: {}
  - if:
    - condition: trigger
      id:
      - returning
    then:
    - action: notify.mobiledevicegroup
      data:
        message: Sekačka se vrací do dobíjecí stanice
        title: Luba
        data:
          notification_icon: mdi:mower
          priority: high
          color: blue
          image: /local/community/spotify/luba.png
    - action: chime_tts.say
      target:
        entity_id:
        - media_player.office
      data:
        message: Sečení dokončeno!
        chime_path: chime
  - if:
    - condition: trigger
      id:
      - charging
    then:
    - action: notify.mobiledevicegroup
      data:
        title: Luba
        message: Nabíjení baterie
        data:
          notification_icon: mdi:mower
          priority: high
          color: blue
          image: /local/community/spotify/luba.png
  mode: single
