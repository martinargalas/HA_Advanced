kids_radio_button_toggle:
  alias: kids_radio_button_toggle
  sequence:
    - choose:
        - conditions:
            - condition: state
              entity_id: input_boolean.kids_radio
              state: 'off'
          sequence:
            - service: media_player.turn_off
              target:
                entity_id: media_player.kids2
            - delay:
                seconds: 2
            - service: media_player.volume_set
              data:
                volume_level: 0.55
              target:
                entity_id: media_player.kids2
            - service: script.media_play_pigy_cz_pohadky
            - service: input_boolean.turn_on
              target:
                entity_id: input_boolean.kids_radio
        - conditions:
            - condition: state
              entity_id: input_boolean.kids_radio
              state: 'on'
          sequence:
            # Vypnutí – jen zastaví media_player
            - service: media_player.turn_off
              target:
                entity_id: media_player.kids2
            - service: input_boolean.turn_off
              target:
                entity_id: input_boolean.kids_radio
  mode: single

multi_tap_action:
  alias: Multi Tap Action
  sequence:
    - repeat:
        for_each: "{{actions}}"
        sequence:
          - if:
              - condition: template
                value_template: >-
                  {{repeat.item.entity_id is not defined and repeat.item.data is
                  not defined }}
            then:
              service: "{{ repeat.item.service }}"
          - if:
              - condition: template
                value_template: >-
                  {{repeat.item.entity_id is defined and repeat.item.data is not
                  defined }}
            then:
              service: "{{ repeat.item.service }}"
              target:
                entity_id: "{{ repeat.item.entity_id }}"
          - if:
              - condition: template
                value_template: >-
                  {{repeat.item.entity_id is not defined and repeat.item.data is
                  defined }}
            then:
              service: "{{ repeat.item.service }}"
              data: >-
                {% set b =  {"browser_id": browser_id} if
                browser_id is defined and "browser_mod" in repeat.item.service else {} %} {{ dict(
                repeat.item.data, **b) }}
          - if:
              - condition: template
                value_template: >-
                  {{repeat.item.entity_id is defined and repeat.item.data is
                  defined }}
            then:
              service: "{{ repeat.item.service }}"
              target:
                entity_id: "{{repeat.item.entity_id}}"
              data: >-
                {% set b =  {"browser_id": browser_id} if
                browser_id is defined and "browser_mod" in repeat.item.service else {} %} {{ dict(
                repeat.item.data, **b) }}
  mode: parallel

