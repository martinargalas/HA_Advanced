type: custom:button-card
name: Ložnice
icon: mdi:bed
show_state: false
show_label: true
show_name: false
tap_action:
  action: none
double_tap_action:
  action: none
hold_action:
  action: none
styles:
  card:
    - height: 180px
    - border-radius: 26px
    - padding: 20px
    - position: relative
    - overflow: hidden
    - transition: transform 0.25s ease
  icon:
    - width: 46px
    - color: var(--button-card-icon)
    - filter: drop-shadow(0 2px 6px var(--button-card-icon-shadow))
  name:
    - font-size: 20px
    - font-weight: 600
    - color: var(--button-card-name)
  label:
    - font-size: 14px
    - color: var(--button-card-label)
      
  grid:
    
    - grid-template-rows: "min-content"
    - grid-template-columns: 1fr 1fr
    - grid-template-rows: 1fr 1fr
    - grid-template-areas: >
        "i i"
        "item1 item2 "

  custom_fields:
    item1:
      - place-self:  center
      - justify-self: center
    item2:
      - place-self:  center
      - justify-self: center
    item3:
      - place-self:  center
      - justify-self: center
    item4:
      - place-self:  center
      - justify-self: center
    
