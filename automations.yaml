      data:
        brightness: 100
        transition: 15
  - if:
    - condition: trigger
      id:
      - 'off'
    then:
    - if:
      - condition: time
        after: '20:00:00'
        before: '23:00:00'
      then:
      - action: hue.activate_scene
        target:
          entity_id: scene.living_room_relax_2
        data:
          transition: 15
    - if:
      - condition: time
