    - name: virtual_battery_month
      state: >  
        {% set startDateForCalculation = now().date() %} 
        {% set yearForCalculation = now().date().year%}
        {% set monthForCalculation = now().date().month %}
        {% set z = state_attr('sensor.pnd_data', 'pnddate') %}
        {% set x = state_attr('sensor.pnd_data', 'production') | count %}
        {% set production = state_attr('sensor.pnd_data', 'production') %}
        {% set consumption = state_attr('sensor.pnd_data', 'consumption') %}
        {% set result = namespace(production=0, consumption=0) %}

        {% set startDateForCalculation = startDateForCalculation.replace(year=yearForCalculation, month=monthForCalculation, day=1) %}
        {% set daysInMonth = (startDateForCalculation.replace(month=startDateForCalculation.month % 12 + 1, day=1) - timedelta(days=1)).day%}
        {% set endDateForCalculation = startDateForCalculation.replace(day=daysInMonth) %}

        {% for i in range(0,x) %}
          {% if (startDateForCalculation|string) <= z[i] <= (endDateForCalculation|string) %}
            {% set result.production = result.production + production[i]|float %}
            {% set result.consumption = result.consumption + consumption[i]|float %}
          {% endif %}   
        {% endfor%}

        {{(result.production - result.consumption)|round(1)}}

    - name: virtual_battery_contract
      state: >  
        {% set startDateForCalculation = now().date() %} 
        {% set startDayForCalculation = states['input_datetime.ElectricityContractStart'].attributes.day %}
        {% set startMonthForCalculation = states['input_datetime.ElectricityContractStart'].attributes.month %} 
        {% set startYearForCalculation = states['input_datetime.ElectricityContractStart'].attributes.year %}
        {% set endDayForCalculation = states['input_datetime.ElectricityContractEnd'].attributes.day %}
        {% set endMonthForCalculation = states['input_datetime.ElectricityContractEnd'].attributes.month %} 
        {% set endYearForCalculation = states['input_datetime.ElectricityContractEnd'].attributes.year %}

        {% set z = state_attr('sensor.pnd_data', 'pnddate') %}
        {% set x = state_attr('sensor.pnd_data', 'production') | count %}
        {% set production = state_attr('sensor.pnd_data', 'production') %}
        {% set consumption = state_attr('sensor.pnd_data', 'consumption') %}
        {% set result = namespace(production=0, consumption=0) %}

        {% set startDateForCalculation = startDateForCalculation.replace(year=startYearForCalculation, month=startMonthForCalculation, day=startDayForCalculation) %}   
        {% set endDateForCalculation = startDateForCalculation.replace(year=endYearForCalculation, month=endMonthForCalculation, day=endDayForCalculation) %}   

        {% for i in range(0,x) %}
          {% if (startDateForCalculation|string) <= z[i] <= (endDateForCalculation|string) %}
            {% set result.production = result.production + production[i]|float %}
            {% set result.consumption = result.consumption + consumption[i]|float %}
          {% endif %}   
        {% endfor%}

        {{(result.production - result.consumption)|round(1)}}



    - name: electricity_statistics
      state: ""
      attributes:
        data: >
          {% set dayOffset = states['input_number.counter_graph'].state|int %}
          {% set dayView = states['switch.energy_daily_view'].state %}
          {% set monthlyView = states['switch.energy_monthly_view'].state %}
          {% set yearlyView = states['switch.energy_yearly_view'].state %}
          {% set viewType = "Day" %}
          {% set startDateForCalculation = now().date() %} 
          {% set endDateForCalculation = '2025-05-31' | as_datetime %}
          {% set result = namespace(production=0, consumption=0) %}
          {% set x = state_attr('sensor.pnd_data', 'production') | count %}
          {% set production = state_attr('sensor.pnd_data', 'production') %}
          {% set consumption = state_attr('sensor.pnd_data', 'consumption') %}
          {% set z = state_attr('sensor.pnd_data', 'pnddate') %}

          {% if dayView == "on" %}
            {% set viewType = "Day" %}
          {% elif monthlyView == "on" %}
            {% set viewType = "Month" %}
          {% elif yearlyView == "on" %}
            {% set viewType = "Year" %}
          {% endif %}

          {% if viewType == "Day"%}
            {% set startDateForCalculation = now().date() + timedelta(days=states['input_number.counter_graph'].state|int) %}
            {% set endDateForCalculation = now().date() + timedelta(days=states['input_number.counter_graph'].state|int) %}

          {% elif viewType == "Month" %}
            {% set monthCurrent = now().date().month%}
            {% set monthForCalculation = monthCurrent %}
            {% set tempMonthHelper = monthCurrent %}
            {% set yearForCalculation = now().date().year%}
          

            {% if ((monthCurrent) + states['input_number.counter_graph'].state|int) <= 0 %}
              {% set monthForCalculation = 12 %}
              {% set tempMonthHelper = 12 %}
            {% endif %}
            {%if tempMonthHelper == 12 and (monthForCalculation + monthCurrent <= 12 ) %}
              {% set monthForCalculation = monthForCalculation + monthCurrent + states['input_number.counter_graph'].state|int%}
              {% set yearForCalculation = yearForCalculation-1 %}
              {% set startDateForCalculation = startDateForCalculation.replace(year=yearForCalculation, month=monthForCalculation, day=1) %}
              {% set daysInMonth = (startDateForCalculation.replace(month=startDateForCalculation.month % 12 + 1, day=1) - timedelta(days=1)).day%}
              {% set endDateForCalculation = startDateForCalculation.replace(day=daysInMonth) %}
            {% else %}
              {% set monthForCalculation = monthForCalculation + states['input_number.counter_graph'].state|int%}
              {% set startDateForCalculation = startDateForCalculation.replace(year=yearForCalculation, month=monthForCalculation, day=1) %}
              {% set daysInMonth = (startDateForCalculation.replace(month=startDateForCalculation.month % 12 + 1, day=1) - timedelta(days=1)).day%}
              {% set endDateForCalculation = startDateForCalculation.replace(day=daysInMonth) %}
            {% endif %}

          {% elif viewType == "Year" %}
            {% set yearForCalculation = now().date().year + states['input_number.counter_graph'].state|int %}
            {% set startDateForCalculation = startDateForCalculation.replace(year=yearForCalculation, month=1, day=1) %}
            {% set endDateForCalculation = startDateForCalculation.replace(year=yearForCalculation, month=12, day=31) %}

          {% endif %}

          {% for i in range(0,x) %}
            {% if (startDateForCalculation|string) <= z[i] <= (endDateForCalculation|string) %}
              {% set result.production = result.production + production[i]|float %}
              {% set result.consumption = result.consumption + consumption[i]|float %}
              {% set result.overflow = result.production - result.consumption %}
              {% set result.gridBuy = result.consumption - result.production %}
            {% endif %}   
          {% endfor%}
          {% if result.gridBuy <= 0 %}
            {% set result.gridBuy = 0 %}
          {% endif %}  
          {% if result.overflow <= 0 %}
            {% set result.overflow = 0 %}
          {% endif %}  
          {% set output = ({"Production": result.production|round(2),
                            "Consumption": result.consumption|round(2),
                            "Overflow": result.overflow|round(2),
                            "GridBuy": result.gridBuy|round(2)})%}
          {{output}}

