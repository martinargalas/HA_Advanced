                border: none;
                margin-bottom: -18px;
              }

        - type: tile
          entity: switch.luba_vsqcfhrv_area_skalka
          name: Skalka
          layout: horizontal
          icon: mdi:map-marker-outline
          hide_state: true
          features_position: inline
          tap_action:
            action: none
          features:
            - type: toggle
          color: "rgba(var(--color-background-theme), 0.5)"
          card_mod:
            style: |
              ha-card {
                background: none;
                box-shadow: none;
                border: none;
                margin-bottom: -18px;
              }

        - type: tile
          entity: switch.luba_vsqcfhrv_area_predzahradka
          name: Předzahrádka
