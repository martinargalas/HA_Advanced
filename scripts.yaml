convert_to_action:
  alias: Convert to actions
  sequence:
  - service: '{{ service1 }}'
    data:
      entity_id: '{{ entity_id1 }}'
  - if:
    - condition: template
      value_template: '{{ service2 is defined }}'
    then:
    - service: '{{ service2 }}'
      data:
        entity_id: '{{ entity_id2 }}'
  - if:
    - condition: template
      value_template: '{{ service3 is defined }}'
    then:
    - service: '{{ service3 }}'
      data:
        entity_id: '{{ entity_id3 }}'
        value: '{{ value_id3 }}'
  - if:
    - condition: template
      value_template: '{{ service4 is defined }}'
    then:
    - service: '{{ service4 }}'
      data:
        entity_id: '{{ entity_id4 }}'
  mode: single

camera_front_stream:
  alias: Stream front camera
  sequence:
  - if:
    - condition: state
      entity_id: switch.front_door_2_rtsp_stream
      state: 'off'
    then:
    - service: script.convert_to_action
      data:
        service1: switch.turn_on
        entity_id1: switch.front_door_2_rtsp_stream
        milliseconds: 0
    - wait_template: '{{ (states("switch.front_door_2_rtsp_stream") == ''on'') }}'
      continue_on_timeout: false
    - service: script.convert_to_action
      data:
        service1: camera.turn_on
        entity_id1: camera.front_door_2
        milliseconds: 0
    - service: script.convert_to_action
      data:
        service1: input_boolean.turn_on
        entity_id1: input_boolean.bubble_stream_tablet_brightness
        milliseconds: 0
    - service: number.set_value
      data:
        value: '255'
      target:
        entity_id: number.zarizeni_tab_a8_uzivatele_martin_screen_brightness
    - delay:
        hours: 0
        minutes: 0
        seconds: 40
        milliseconds: 0
    - service: script.convert_to_action
      data:
        service1: input_boolean.turn_off
        entity_id1: input_boolean.bubble_stream_tablet_brightness
        milliseconds: 0
    - service: script.convert_to_action
      data:
        service1: camera.turn_off
        entity_id1: camera.front_door_2
        milliseconds: 0
    - service: script.convert_to_action
      data:
        service1: switch.turn_off
        entity_id1: switch.front_door_2_rtsp_stream
        milliseconds: 0

