view_layout:
  grid-area: thermostat_big
type: custom:vertical-stack-in-card
card_mod:
  style: |
    ha-card {
      border-radius: 34px;
      background: none;
      backdrop-filter: blur(35px) saturate(100%);
      -webkit-backdrop-filter: blur(35px) saturate(100%);
      border: 1px solid var(--mod-card-border);
      box-shadow: 
        0 15px 25px var(--mod-card-shadow), 
        inset 0 2px 3px var(--mod-card-inset-shadow);
    }
    
    ha-card::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 26px;
      box-shadow:
        inset 0 0 0 1px var(--button-card-after-border),
        inset 0 0 20px var(--button-card-after-shadow);
      pointer-events: none;
    }
      
cards:
  - !include /config/ui_lovelace_minimalist/cards/bubble_cards/utilities/mobile/utilities_heat_pump_mode.yaml

  - !include /config/ui_lovelace_minimalist/cards/bubble_cards/utilities/mobile/utilities_heat_pump_stats.yaml

