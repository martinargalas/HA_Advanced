type: custom:layout-card
layout_type: custom:grid-layout

layout:
  grid-template-columns: 0.5fr 0.5fr 0.5fr 0.5fr
  grid-template-rows: min-content
  grid-template-areas: >
    "temperature_setting_title temperature_setting_title temperature_setting_title temperature_setting_title"
    "thermostats thermostats thermostats thermostats"
    "thermostats thermostats thermostats thermostats "
    "thermostats thermostats thermostats thermostats"
    "heat_pump_desc heat_pump_desc heat_pump_desc heat_pump_desc"
    "thermostat_big thermostat_big thermostat_big thermostat_big"
    "filter filter filter filter"

cards:

  - view_layout:
      grid-area: filter
    type: conditional
    conditions:
      - condition: state
        entity: sun.sun
        state: "above_horizon"
    card:
      type: custom:bubble-card
      card_type: select
      name: ' '
      show_state: false
      show_icon: false
      entity: input_select.utilities_heat_pump_mode
      icon: mdi:heating-coil
      tap_action:
        action: none
      styles: | 
        ha-card {
          --bubble-select-list-item-accent-color: rgba(var(--color-background-macos-blue),0.8) !important;
          --bubble-select-list-background-color: rgba(var(--color-background-black),0.3) !important;
          --bubble-select-icon-background-color: rgba(var(--color-background-macos-blue),0.25) !important;
        }

        .bubble-select-background {
          opacity: 10 !important;
          background-color: rgba(var(--color-background-macos-blue),1) !important;
        }

        .bubble-select-card-container {
          background: none !important;
          opacity: 10 !important;
          height: 50px !important;
          top: -476px !important;
          left: 170px !important;
          width: 176px !important;
          z-index: 5;
        }

        .card-content {
          width: 44%;
          margin: 0 !important;
        }

        .bubble-icon-container {
          background: transparent !important;
          color: var(--text-color) !important;
        }

        .bubble-dropdown-container {
          background-color: transparent !important;   # Ponecháno původní
        }

        .bubble-dropdown-arrow {
          width: 46px !important;
          height: 46px !important;
          border-radius: 50% !important;
          overflow: hidden !important;
          display: flex;
          align-items: center;
          justify-content: center;
          background-color: rgba(var(--color-background-black), 0.5) !important;
          background: linear-gradient(
              120deg,
              var(--button-card-before-gradient-start),
              var(--button-card-before-gradient-mid) 30%,
              var(--button-card-before-gradient-end) 60%
            );
          box-shadow:
            inset 0 0 0 1px var(--button-card-after-border),
            inset 0 0 20px var(--button-card-after-shadow);
          pointer-events: none;
        }

        .mwc-list-item {
          background-color: rgba(var(--color-background-macos-blue),0.15) !important;
        }

        * { 
          font-size: 14px !important;
          font-weight: 600 !important;
          color: var(--text-color) !important;
        }

        .bubble-name-container {
          color: var(--text-color) !important;
        }

  ############################################################
  # NOC – sun below horizon (původní barvy)
  ############################################################
  - view_layout:
      grid-area: filter
    type: conditional
    conditions:
      - condition: state
        entity: sun.sun
        state: "below_horizon"
    card:
      type: custom:bubble-card
      card_type: select
      name: ' '
      show_state: false
      show_icon: false
      entity: input_select.utilities_heat_pump_mode
      icon: mdi:heating-coil
      tap_action:
        action: none
      styles: | 
        ha-card {
          --bubble-select-list-item-accent-color: rgba(var(--color-blue),0.7) !important;
          --bubble-select-list-background-color: rgba(var(--color-black),0.4) !important;
          --bubble-select-icon-background-color: rgba(var(--color-black),0.4) !important;
        }

        .bubble-select-background {
          opacity: 10 !important;
          background-color: rgba(var(--color-grey),0.1) !important;
        }

        .bubble-select-card-container {
          background: none !important;
          opacity: 10 !important;
          height: 50px !important;
          top: -476px !important;
          left: 170px !important;
          width: 176px !important;
          z-index: 5;
        }

        .card-content {
          width: 44%;
          margin: 0 !important;
        }

        .bubble-icon-container {
          background: transparent !important;
        }

        .bubble-dropdown-container {
          background-color: transparent !important;
        }

        .bubble-dropdown-arrow {
          width: 46px !important;
          height: 46px !important;
          border-radius: 50% !important;
          overflow: hidden !important;
          display: flex;
          align-items: center;
          justify-content: center;
          background-color: rgba(var(--color-background-grey),0.2) !important;
        }

        .bubble-select-background {
          color: var(--rgb-primary-text-color) !important;
          background: none !important;
        }

        .mwc-list-item {
          background-color: rgba(var(--rgb-primary-text-color),0.1) !important;
          background: none !important;
        }

        * { 
          font-size: 14px !important;
          font-weight: 600 !important;
          color: var(--rgb-primary-text-color) !important;
        }

        .bubble-name-container {
          color: var(--rgb-primary-text-color) !important;
        }

        .bubble-icon-container {
          color: var(--rgb-primary-text-color) !important;
        }

