
  # ===== Termostat =====
type: custom:mushroom-climate-card
entity: "{{ entity }}"
show_temperature_control: true
collapsible_controls: false
secondary_info: none
name: "{{ name }}"
layout: horizontal
fill_container: true
icon: mdi:hanger
card_mod:
  style:
    mushroom-state-info$: |
      .container {
        --card-primary-color: rgba(var(--primary-text-color),0.7);
        --card-secondary-color: rgba(var(--primary-text-color),0.7);
      }
      .primary {
        background: rgba(var(--color-background-black),0.3) !important;
        color: white;
        margin-top: -73px !important;
        margin-left: -96px !important;
        border-radius: 32px;
        width: 310px !important;
        height: 58px !important;
        display: inline-flex;
        justify-content: center;
        align-items: center;
        font-size: 14px !important;
        font-weight: 600;
        line-height: 1;
        transform: translate(12px, 6px);
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
        pointer-events: none;
      }

    mushroom-climate-temperature-control$:
      mushroom-input-number$: |
        .container {
          margin-top: -39px !important;
          margin-left: -15px !important;
          border-radius: 20px;
          background: rgba(var(--color-background-grey),0.2) !important;
          height: 38px !important;
        }

    mushroom-shape-icon$: |
      {% set hvac = state_attr(entity, 'hvac_action') %}
      ::part(badge) { display: none !important; }
      .shape {
        {% set temp = states(temp_sensor) | float(0) %}
        {% set rgb, anim, glow_anim, halo_anim, duration, intensity = '0,140,255', 'temp-cold-breathe', 'temp-cold-glow', 'temp-cold-halo', 15.0, 1.0 %}

        {% if temp < 16 %}
          {% set rgb, anim, glow_anim, halo_anim, duration, intensity = '0,140,255','temp-cold-breathe','temp-cold-glow','temp-cold-halo',15.0,1.0 %}
        {% elif temp < 18 %}
          {% set rgb, anim, glow_anim, halo_anim, duration, intensity = '255,210,40','temp-cool-wave','temp-cool-glow','temp-cool-halo',10.0,1.0 %}
        {% elif temp < 20 %}
          {% set rgb, anim, glow_anim, halo_anim, duration, intensity = '255,150,40','temp-comfy-breathe','temp-comfy-glow','temp-comfy-halo',5.0,1.0 %}
        {% elif temp < 23.5 %}
          {% set rgb, anim, glow_anim, halo_anim, duration, intensity = '255,115,20','temp-warm-pulse','temp-warm-glow','temp-warm-halo',10.0,1.0 %}
        {% else %}
          {% set rgb, anim, glow_anim, halo_anim, duration, intensity = '255,40,40','temp-hot-shimmer','temp-hot-glow','temp-hot-halo',15.0,1.0 %}
        {% endif %}

        --temp-rgb: {{ rgb }};
        --temp-intensity: {{ intensity }};

        {% if hvac == 'heating' %}
          --shape-animation: {{ anim }} {{ duration }}s ease-in-out infinite;
          --temp-glow-animation: {{ glow_anim }} {{ (duration*0.9)|round(2) }}s ease-in-out infinite;
          --temp-halo-animation: {{ halo_anim }} {{ (duration*1.15)|round(2) }}s ease-in-out infinite;
          --icon-color: rgba({{ rgb }},1);
          background-color: rgba({{ rgb }},0.2) !important;
        {% else %}
          --shape-animation: none;
          --temp-glow-animation: none;
          --temp-halo-animation: none;
          --icon-color: rgba(160,160,160,0.7);
          background-color: rgba(160,160,160,0.7);
        {% endif %}

        opacity:1;
        z-index:2;
        box-shadow:none !important;
        border:1px solid rgba(255,255,255,0.06);
        position:relative;
        transform-origin:50% 60%;
        animation: var(--shape-animation);
      }

    .: |
      mushroom-shape-icon { --icon-size: 48px; display: flex; padding-right: 20px; padding-bottom: 80px; margin:5px; }
      ha-card {
        clip-path: inset(0 0 0 0 round var(--ha-card-border-radius,14px));
        --card-primary-font-size: 1.4rem !important;
        --card-primary-line-height: 1.3 !important;
      }

# ===== Graf teploty =====
type: custom:vertical-stack-in-card
cards:
  - type: custom:mini-graph-card
    entities:
      - "{{ temp_sensor }}"
    hours_to_show: 24
    line_width: 5
    decimals: 1
    show:
      name: false
      icon: false
      state: true
      labels: false
      legend: false
    color_thresholds:
      - value: 0
        color: rgb(0,140,255)
      - value: 16
        color: rgb(255,210,40)
      - value: 18
        color: rgb(255,150,40)
      - value: 20
        color: rgb(255,210,150)
      - value: 23.5
        color: rgb(255,150,100)
    card_mod:
      style: |
        ha-card svg path {
          {% set temp = states(temp_sensor) | float(0) %}
          {% if temp < 16 %}{% set glow='0,140,255' %}
          {% elif temp < 18 %}{% set glow='255,210,40' %}
          {% elif temp < 20 %}{% set glow='255,150,40' %}
          {% elif temp < 23.5 %}{% set glow='255,210,150' %}
          {% else %}{% set glow='255,40,40' %}{% endif %}
          filter:
            drop-shadow(0 0 4px rgba({{ glow }},0.5))
            drop-shadow(0 0 6px rgba({{ glow }},0.3));
        }
        ha-card { background:none; box-shadow:none; opacity:80%; border:none; width:400px; mask-image: radial-gradient(ellipse at 50% 90%, rgba(0,0,0,1)0%, rgba(0,0,0,0.9)20%, rgba(0,0,0,0)80%); }
        ha-card .state { font-size:0.7rem; font-weight:400; }
        .name { color: rgba(var(--primary-text-color),0.7); font-size:14px; font-weight:600; }
        .state { right:-200px !important; top:80px !important; left:auto !important; text-align:right; }

card_mod:
  style:
    .: |
      ha-card { background:none; box-shadow:none; border:none; margin:8px 12px; position:absolute; bottom:-10px; right:-10px; pointer-events:none; }
