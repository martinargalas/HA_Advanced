view_layout:
  grid-area: "robot_3"
type: custom:vertical-stack-in-card
card_mod:
  style: |
    ha-card {
      border-radius: 34px;
      background: var(--mod-card-background);
      backdrop-filter: blur(35px) saturate(100%);
      -webkit-backdrop-filter: blur(35px) saturate(200%);
      border: 1px solid var(--mod-card-border);
      box-shadow: 
        0 15px 25px var(--mod-card-shadow), 
        inset 0 2px 3px var(--mod-card-inset-shadow);
    }

    ha-card::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 34px;
      background: linear-gradient(
        120deg,
        var(--mod-card-gradient-start),
        var(--mod-card-gradient-mid) 25%,
        var(--mod-card-gradient-end) 50%,
        transparent 70%
      );
      opacity: 0.35;
      pointer-events: none;
    }
cards:
  - type: custom:vertical-stack-in-card
    card_mod:
      style: |
        ha-card {
            background-color: transparent;
            box-shadow: none;
          }
    cards:
    - type: custom:button-card
      entity: input_boolean.alarmed_toggle
      show_icon: false
      show_label: false
      show_name: false
      tap_action:
        action: none    
      custom_fields:
        item1:
          card:
            type: custom:button-card
            entity: switch.switch_mower_camera

            show_name: false
            show_label: true
            show_icon: false
            label: Kamera

            tap_action:
              action: call-service
              service: script.multi_tap_action
              data:
                actions:
                  - service: switch.turn_off
                    entity_id: switch.switch_mower_zones
                  - service: switch.turn_on
                    entity_id: switch.switch_mower_camera

            hold_action:
              action: none

            double_tap_action:
              action: none

            card_mod:
              style: |
                @keyframes ping {
                  0% {
                    box-shadow: 0 0 0 0 rgba(var(--color-background-theme), 0.9);
                  }
                  70% {
                    box-shadow: 0 0 0 12px rgba(var(--color-background-theme), 0);
                  }
                  100% {
                    box-shadow: 0 0 0 0 rgba(var(--color-background-theme), 0);
                  }
                }

                ha-card {
                  z-index: 2 !important;
                }

            styles:
              card:
                - border-radius: 42px
                - height: 42px
                - width: 160px
                - padding: 0
                - left: 8px
                - box-shadow: "none"

                - animation: >-
                    [[[
                      if (states['switch.switch_mower_camera'].state == 'on') {
                        return "ping 0.8s ease-out 1";
                      }
                      return "none";
                    ]]]

                - background-color: >-
                    [[[
                      return states['switch.switch_mower_camera'].state == 'on'
                        ? "rgba(var(--color-background-theme), 0.5)"
                        : "rgba(var(--color-grey), 0.2)";
                    ]]]

              label:
                - justify-self: center
                - font-size: 14px
                - font-weight: 430
                - text-overflow: ellipsis
                - overflow: hidden

        item2:
          card:
            type: custom:button-card
            entity: switch.switch_mower_zones

            show_name: false
            show_label: true
            show_icon: false
            label: Zóny

            tap_action:
              action: call-service
              service: script.multi_tap_action
              data:
                actions:
                  - service: switch.turn_on
                    entity_id: switch.switch_mower_zones
                  - service: switch.turn_off
                    entity_id: switch.switch_mower_camera

            hold_action:
              action: none

            double_tap_action:
              action: none

            card_mod:
              style: |
                @keyframes ping {
                  0% {
                    box-shadow: 0 0 0 0 rgba(var(--color-background-theme), 0.9);
                  }
                  70% {
                    box-shadow: 0 0 0 12px rgba(var(--color-background-theme), 0);
                  }
                  100% {
                    box-shadow: 0 0 0 0 rgba(var(--color-background-theme), 0);
                  }
                }

                ha-card {
                  z-index: 2 !important;
                }

            styles:
              card:
                - border-radius: 42px
                - height: 42px
                - width: 160px
                - padding: 0
                - right: 8px
                - box-shadow: "none"

                - animation: >-
                    [[[
                      if (states['switch.switch_mower_zones'].state == 'on') {
                        return "ping 0.8s ease-out 1";
                      }
                      return "none";
                    ]]]

                - background-color: >-
                    [[[
                      return states['switch.switch_mower_zones'].state == 'on'
                        ? "rgba(var(--color-background-theme), 0.5)"
                        : "rgba(var(--color-grey), 0.3)";
                    ]]]

              label:
                - justify-self: center
                - font-size: 14px
                - font-weight: 430
                - text-overflow: ellipsis
                - overflow: hidden

      styles:
        card:
          - padding: 0px
          - overflow: hidden
          - box-shadow: "var(--box-shadow)"
          - background-color: rgba(var(--color-background-black),0.2);
        grid:
          - overflow: hidden
          - grid-template-areas: 
              '"item1 item2"'
          - grid-template-columns: 1fr 1fr
          - grid-template-rows: 1fr

        custom_fields:
          item1:
            - place-self:  center
            - justify-self: left
          item2:
            - place-self:  center
            - justify-self: right
            
          
      card_mod:
        style: |
          ha-card {
            height: 56px;
            border-radius: 99px !important;
            overflow: hidden !important;
            max-width: 344px !important;
            margin: 10px !important;
          }

    - type: conditional
      conditions:
        - condition: state
          entity: switch.switch_mower_camera
          state: 'on'
      card:
        type: vertical-stack
        cards:
          - type: picture-entity
            entity: camera.luba_vsqcfhrv_none
            camera_view: live
            camera_image: camera.luba_vsqcfhrv_none
            show_name: false
            show_state: false
            card_mod:
              style: |
                ha-card {
                  margin-left: 10px;
                  margin-right: 10px;
                  margin-bottom: -10px;
                  overflow: hidden;
                  height: 256px !important;        
                }

          - !include /config/ui_lovelace_minimalist/cards/bubble_cards/cleaning/robot_3a_Control.yaml

    - type: conditional
      conditions:
        - condition: state
          entity: switch.switch_mower_zones
          state: 'on'
      card:
        type: vertical-stack
        cards:
        - type: tile
          entity: switch.luba_vsqcfhrv_area_horni
          name: Horní zóna
          layout: horizontal
          icon: mdi:map-marker-outline
          hide_state: true
          features_position: inline
          tap_action:
            action: none
          features:
            - type: toggle
          color: "rgba(var(--color-background-theme), 0.5)"
          card_mod:
            style: |
              ha-card {
                background: none;
                box-shadow: none;
                border: none;
                margin-bottom: -18px;
              }

        - type: tile
          entity: switch.luba_vsqcfhrv_area_prostredni
          name: Prostřední zóna
          layout: horizontal
          icon: mdi:map-marker-outline
          hide_state: true
          features_position: inline
          tap_action:
            action: none
          features:
            - type: toggle
          color: "rgba(var(--color-background-theme), 0.5)"
          card_mod:
            style: |
              ha-card {
                background: none;
                box-shadow: none;
                border: none;
                margin-bottom: -18px;
              }

        - type: tile
          entity: switch.luba_vsqcfhrv_area_spodni_2
          name: Spodní zóna
          layout: horizontal
          icon: mdi:map-marker-outline
          hide_state: true
