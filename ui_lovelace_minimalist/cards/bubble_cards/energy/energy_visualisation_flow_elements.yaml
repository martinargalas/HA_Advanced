
######################
# Levý rámeček
######################
- type: custom:button-card
  name: ""
  show_name: false
  show_icon: false
  tap_action: none
  hold_action: none
  styles:
    card:
      - width: 170px
      - height: 56px
      - border-radius: 29px
      - background-color: rgba(var(--color-background-black), 0.3)
      - box-shadow: none
      - border: none
  style:
    top: 40px
    left: 12px
    transform: translateY(-50%)
  card_mod:
    style: |
      ha-card::before {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 26px;
        background: linear-gradient(
          120deg,
          var(--button-card-before-gradient-start),
          var(--button-card-before-gradient-mid) 30%,
          var(--button-card-before-gradient-end) 60%
        );
        opacity: 0.35;
        pointer-events: none;
      }
      ha-card::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 26px;
        box-shadow:
          inset 0 0 0 1px var(--button-card-after-border),
          inset 0 0 20px var(--button-card-after-shadow);
        pointer-events: none;
      }
      ha-card:active {
        transform: scale(0.97);
      }

- type: custom:button-card
  entity: sensor.pv_power
  name: ""
  show_name: false
  show_icon: true
  icon: mdi:solar-power
  tap_action: none
  hold_action: none
  styles:
    card:
      - width: 48px
      - height: 48px
      - border-radius: 50%
      - background-color: rgba(var(--color-background-theme),0.2)
      - padding: 0
    icon:
      - width: 28px
      - height: 28px
      - margin: auto
      - color: rgba(var(--color-background-theme),1)
      - filter: drop-shadow(0 0 4px rgba(var(--color-background-theme),0.4))
      - animation: glowPulse 4s infinite
  style:
    top: 40px
    left: 16px
    transform: translateY(-50%)

- type: state-label
  entity: sensor.pv_power
  style:
    top: 12px
    left: 72px
    transform: translateY(-50%)
    color: var(--primary-text-color);
    font-size: 24px
    font-weight: bold
    text-shadow: 0 0 2px rgba(var(--color-background-theme-secondary),0.8)
    animation: glowPulse 4s infinite

