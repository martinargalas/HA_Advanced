view_layout:
  grid-area: "media_hub_playlist2"  
type: custom:vertical-stack-in-card
card_mod:
  style: |
    ha-card {
      border-radius: 34px;
      padding: 10px !important;
      background: var(--mod-card-background);
      backdrop-filter: blur(35px) saturate(100%);
      -webkit-backdrop-filter: blur(35px) saturate(200%);
      border: 1px solid var(--mod-card-border);
      box-shadow: 
        0 15px 25px var(--mod-card-shadow), 
        inset 0 2px 3px var(--mod-card-inset-shadow);
    }

    ha-card::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 34px;
      background: linear-gradient(
        120deg,
        var(--mod-card-gradient-start),
        var(--mod-card-gradient-mid) 25%,
        var(--mod-card-gradient-end) 50%,
        transparent 70%
      );
      opacity: 0.35;
      pointer-events: none;
    }
cards:
  - type: custom:sonos-card
    card_mod:
      style: |
        ha-card {
          max-height: 350px !important;
          
          background: transparent !important;
          
          box-shadow: none !important;
        }
    mediaBrowser:
      itemsPerRow: 4
      hideHeader: true
      hideActivePlayerName: true
      onlyFavorites: true
      favorites:
        exclude: []
        topItems: []
        hideTitleForThumbnailIcons: true
    sections:
      - media browser
    widthPercentage: 50
    minWidth: 50
    startSection: media browser
    entityId: media_player.office
  
  - type: custom:sonos-card
    mediaBrowser:
      itemsPerRow: 4
      hideHeader: true
      hideActivePlayerName: true
      onlyFavorites: true
      favorites:
        exclude: []
        topItems: []
        hideTitleForThumbnailIcons: true
    sections:
      - queue
    startSection: queue
    widthPercentage: 125.5
    player:
      artworkAsBackgroundBlur: 21
      artworkAsBackground: true
      artworkBorderRadius: 30
      controlsAndHeaderBackgroundOpacity: 0.8
      controlsLargeIcons: true
      hideArtistAlbum: true
      hideArtwork: true
      backgroundOverlayColor: rgba(142,142,147,0.58)
      hideControlPowerButton: true
      hideControls: true
      hideControlNextTrackButton: true
    showNonSonosPlayers: true
    excludeItemsInEntitiesList: false
    queue:
      hideActivePlayerName: true
    entities: []
    entityId: media_player.office
    card_mod:
      style: |
        ha-card {
          max-height: 190px !important;
          margin-top: 20px !important;
          margin-left: -1px !important;
          background: transparent !important;
          
          box-shadow: none !important;
        }
