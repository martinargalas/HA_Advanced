type: vertical-stack
cards:
  # OFFICE
  - view_layout:
      grid-area: "blinds_1_title"
    type: custom:bubble-card
    card_type: separator
    name: Pracovna
    icon: mdi:chair-rolling
    styles: |
      .bubble-line {
        background: rgba(var(--color-background-black),0.4);
        opacity: 1;
      }
      .bubble-container {
        color: var(--text-color);
      }

  - view_layout:
      grid-area: "blinds_1"
      place-self: center left
    type: entities
    show_header_toggle: false
    card_mod:
      style: |
        ha-card {
          height: 600px;
          border-radius: 34px;
          padding: 5px;
          background: var(--mod-card-background);
          backdrop-filter: blur(35px) saturate(100%);
          -webkit-backdrop-filter: blur(35px) saturate(200%);
          border: 1px solid var(--mod-card-border);
          box-shadow: 
            0 15px 25px var(--mod-card-shadow), 
            inset 0 2px 3px var(--mod-card-inset-shadow);
        }

        ha-card::before {
          content: "";
          position: absolute;
          inset: 0;
          border-radius: 34px;
          background: linear-gradient(
            120deg,
            var(--mod-card-gradient-start),
            var(--mod-card-gradient-mid) 25%,
            var(--mod-card-gradient-end) 50%,
            transparent 70%
          );
          opacity: 0.35;
          pointer-events: none;
        }
    entities:
      - type: custom:mushroom-cover-card
        entity: cover.office
        primary_info: state
        fill_container: true
        show_position_control: false
        show_tilt_position_control: false
        layout: horizontal
        secondary_info: none
        show_buttons_control: true
        name: Pozice
        icon_type: none
        tap_action:
          action: call-service
          service: switch.turn_on
          data: {}
          target:
            entity_id: switch.office_blinds_user_switch
        card_mod:
          style: |
            ha-card::before {
              content: "";
              position: absolute;
              inset: 0;
              border-radius: 26px;
              background: linear-gradient(
                120deg,
                var(--button-card-before-gradient-start),
                var(--button-card-before-gradient-mid) 30%,
                var(--button-card-before-gradient-end) 60%
              );
              opacity: 0.35;
              pointer-events: none;
            }
            ha-card::after {
              content: "";
              position: absolute;
              inset: 0;
              border-radius: 26px;
              box-shadow:
                inset 0 0 0 1.5px var(--button-card-after-border),
                inset 0 0 20px var(--button-card-after-shadow);
              pointer-events: none;
            } 

      - type: custom:mushroom-cover-card
        entity: cover.office
        primary_info: name
        fill_container: true
        show_position_control: false
        show_tilt_position_control: true
        layout: horizontal
        secondary_info: none
        show_buttons_control: false
        name: Náklon
        icon_type: none
        tap_action:
          action: call-service
          service: switch.turn_on
          data: {}
          target:
            entity_id: switch.office_blinds_user_switch
        card_mod:
          style: |
            ha-card::before {
              content: "";
              position: absolute;
              inset: 0;
              border-radius: 26px;
              background: linear-gradient(
                120deg,
                var(--button-card-before-gradient-start),
                var(--button-card-before-gradient-mid) 30%,
                var(--button-card-before-gradient-end) 60%
              );
              opacity: 0.35;
              pointer-events: none;
            }
            ha-card::after {
              content: "";
              position: absolute;
              inset: 0;
              border-radius: 26px;
              box-shadow:
                inset 0 0 0 1.5px var(--button-card-after-border),
                inset 0 0 20px var(--button-card-after-shadow);
              pointer-events: none;
            } 

